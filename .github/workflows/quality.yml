name: Local quality

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-quality:
    name: Python 3.12 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
    env:
      WISDOME_ENVIRONMENT: development
      WISDOME_RUNTIME_MODE: local
      HUMANIZER_BASE_URL: http://127.0.0.1:3210
    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Korean font
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends fonts-noto-cjk

      - name: Install pinned uv
        run: python -m pip install uv==0.12.7

      - name: Sync locked dependencies
        run: uv sync --frozen --extra dev

      - name: Create and migrate fresh local SQLite
        run: |
          uv run python scripts/prepare_ci_sqlite.py
          uv run python src/manage.py migrate --noinput

      - name: Ruff changed files and local content
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: uv run python scripts/ci_changed_python.py

      - name: Django checks
        run: |
          uv run python src/manage.py check
          uv run python src/manage.py makemigrations --check --dry-run

      - name: Deterministic local unit and integration tests
        run: uv run python -m pytest -q tests/unit tests/integration
