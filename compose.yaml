name: wisdome-super-writer

x-app: &app
  build:
    context: .
    dockerfile: deploy/containers/app/Dockerfile
  env_file: .env
  volumes:
    - ./src:/app/src
    - ./config:/app/config:ro
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    minio-bootstrap:
      condition: service_completed_successfully
  restart: unless-stopped

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: wisdome
      POSTGRES_USER: wisdome
      POSTGRES_PASSWORD: wisdome
      TZ: Asia/Seoul
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wisdome -d wisdome"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-bootstrap:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set local http://minio:9000 minioadmin minioadmin
        mc mb --ignore-existing local/wisdome-writer
        mc version enable local/wisdome-writer
        mc anonymous set none local/wisdome-writer

  web:
    <<: *app
    command: python src/manage.py runserver 0.0.0.0:8000
    ports:
      - "8000:8000"

  worker:
    <<: *app
    command: celery -A wisdome_writer worker --loglevel=INFO --queues=default,collect,extract.generic,generate,publish

  ocr-worker:
    build:
      context: .
      dockerfile: deploy/containers/paddleocr-worker/Dockerfile
    env_file: .env
    command: celery -A wisdome_writer worker --loglevel=INFO --queues=extract.ocr.paddle --concurrency=1
    volumes:
      - ./src:/app/src
      - ./config:/app/config:ro
      - paddle-models:/models/paddleocr:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-bootstrap:
        condition: service_completed_successfully
    restart: unless-stopped

  beat:
    <<: *app
    command: celery -A wisdome_writer beat --loglevel=INFO

volumes:
  postgres-data:
  redis-data:
  minio-data:
  paddle-models:
