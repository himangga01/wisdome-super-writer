name: wisdome-super-writer

x-runtime-environment: &runtime-environment
  WISDOME_ENVIRONMENT: ${WISDOME_ENVIRONMENT:?set development or production}
  DJANGO_SETTINGS_MODULE: wisdome_writer.settings
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY}
  DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?set DJANGO_ALLOWED_HOSTS}
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?set PUBLIC_BASE_URL}
  DJANGO_CSRF_TRUSTED_ORIGINS: ${PUBLIC_BASE_URL:?set PUBLIC_BASE_URL}
  DATABASE_URL: postgresql://${POSTGRES_RUNTIME_USER:?set POSTGRES_RUNTIME_USER}:${POSTGRES_RUNTIME_PASSWORD:?set POSTGRES_RUNTIME_PASSWORD}@postgres:5432/${POSTGRES_DB:?set POSTGRES_DB}
  REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379/0
  CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379/0
  CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379/1
  AWS_ACCESS_KEY_ID: ${MINIO_APP_USER:?set MINIO_APP_USER}
  AWS_SECRET_ACCESS_KEY: ${MINIO_APP_PASSWORD:?set MINIO_APP_PASSWORD}
  AWS_STORAGE_BUCKET_NAME: ${AWS_STORAGE_BUCKET_NAME:?set AWS_STORAGE_BUCKET_NAME}
  AWS_S3_ENDPOINT_URL: http://minio:9000
  AWS_S3_REGION_NAME: ${AWS_S3_REGION_NAME:?set AWS_S3_REGION_NAME}
  AWS_S3_ADDRESSING_STYLE: ${AWS_S3_ADDRESSING_STYLE:-path}
  OBJECT_STORAGE_PRESIGN_TTL_SECONDS: ${OBJECT_STORAGE_PRESIGN_TTL_SECONDS:-300}
  AUDIT_CURSOR_SIGNING_KEY: ${AUDIT_CURSOR_SIGNING_KEY:?set AUDIT_CURSOR_SIGNING_KEY}
  REAUTH_PROOF_TTL_SECONDS: ${REAUTH_PROOF_TTL_SECONDS:-300}
  REAUTH_FAILURE_LIMIT: ${REAUTH_FAILURE_LIMIT:-5}
  REAUTH_FAILURE_WINDOW_SECONDS: ${REAUTH_FAILURE_WINDOW_SECONDS:-300}
  REAUTH_LOCK_SECONDS: ${REAUTH_LOCK_SECONDS:-300}
  REAUTH_MFA_REQUIRED: ${REAUTH_MFA_REQUIRED:-false}
  REAUTH_MFA_VALIDATOR: ${REAUTH_MFA_VALIDATOR:-}
  SECRET_PROVIDER_CLASSES: ${SECRET_PROVIDER_CLASSES:-{}}
  TZ: ${TZ:-Asia/Seoul}

x-collection-environment: &collection-environment
  DATA_GO_KR_SERVICE_KEY: ${DATA_GO_KR_SERVICE_KEY:-}

x-blogger-environment: &blogger-environment
  BLOGGER_OAUTH_CLIENT_ID_REF: ${BLOGGER_OAUTH_CLIENT_ID_REF:-}
  BLOGGER_OAUTH_CLIENT_SECRET_REF: ${BLOGGER_OAUTH_CLIENT_SECRET_REF:-}
  BLOGGER_OAUTH_CLIENT_ID: ${BLOGGER_OAUTH_CLIENT_ID:-}
  BLOGGER_OAUTH_CLIENT_SECRET: ${BLOGGER_OAUTH_CLIENT_SECRET:-}
  BLOGGER_ACCESS_TOKEN: ${BLOGGER_ACCESS_TOKEN:-}
  BLOGGER_OAUTH_TOKEN_STORE: ${BLOGGER_OAUTH_TOKEN_STORE:-}

x-app: &app
  build:
    context: .
    dockerfile: deploy/containers/app/Dockerfile
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    minio-bootstrap:
      condition: service_completed_successfully
    migrate:
      condition: service_completed_successfully
  restart: unless-stopped

services:
  postgres:
    image: postgres:17.5-alpine@sha256:6567bca8d7bc8c82c5922425a0baee57be8402df92bae5eacad5f01ae9544daa
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      TZ: ${TZ:-Asia/Seoul}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - database
    restart: unless-stopped

  redis:
    image: redis:7.4.5-alpine@sha256:bb186d083732f669da90be8b0f975a37812b15e913465bb14d845db72a4e3e08
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    networks:
      - broker
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z@sha256:a1ea29fa28355559ef137d71fc570e508a214ec84ff8083e39bc5428980b015e
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - object-storage
    restart: unless-stopped

  minio-bootstrap:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z@sha256:aead63c77f9db9107f1696fb08ecb0faeda23729cde94b0f663edf4fe09728e3
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      MINIO_APP_USER: ${MINIO_APP_USER:?set MINIO_APP_USER}
      MINIO_APP_PASSWORD: ${MINIO_APP_PASSWORD:?set MINIO_APP_PASSWORD}
      AWS_STORAGE_BUCKET_NAME: ${AWS_STORAGE_BUCKET_NAME:?set AWS_STORAGE_BUCKET_NAME}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        test "$${MINIO_APP_USER}" != "$${MINIO_ROOT_USER}"
        test "$${MINIO_APP_PASSWORD}" != "$${MINIO_ROOT_PASSWORD}"
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing "local/$${AWS_STORAGE_BUCKET_NAME}"
        mc version enable "local/$${AWS_STORAGE_BUCKET_NAME}"
        mc anonymous set none "local/$${AWS_STORAGE_BUCKET_NAME}"
        cat > /tmp/wisdome-writer-policy.json <<EOF
        {
          "Version": "2012-10-17",
          "Statement": [{
            "Effect": "Allow",
            "Action": [
              "s3:GetObject",
              "s3:GetObjectVersion",
              "s3:PutObject",
              "s3:DeleteObject",
              "s3:DeleteObjectVersion"
            ],
            "Resource": ["arn:aws:s3:::$${AWS_STORAGE_BUCKET_NAME}/*"]
          }]
        }
        EOF
        mc admin user add local "$${MINIO_APP_USER}" "$${MINIO_APP_PASSWORD}"
        mc admin policy create local wisdome-writer-app /tmp/wisdome-writer-policy.json
        mc admin policy attach local wisdome-writer-app --user "$${MINIO_APP_USER}"
    networks:
      - object-storage
    restart: "no"

  migrate:
    build:
      context: .
      dockerfile: deploy/containers/app/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: [*runtime-environment, *blogger-environment]
      DATABASE_URL: postgresql://${POSTGRES_USER:?set POSTGRES_USER}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_RUNTIME_USER: ${POSTGRES_RUNTIME_USER:?set POSTGRES_RUNTIME_USER}
      POSTGRES_RUNTIME_PASSWORD: ${POSTGRES_RUNTIME_PASSWORD:?set POSTGRES_RUNTIME_PASSWORD}
    command:
      - /bin/sh
      - -ec
      - |
        python src/manage.py migrate --noinput
        python src/manage.py configure_runtime_database_role
    networks:
      - database
    restart: "no"

  web:
    <<: *app
    environment:
      <<: [*runtime-environment, *blogger-environment]
    command: ["/app/deploy/containers/app/entrypoint.sh"]
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8000}:8000"
    networks:
      - web
      - database
      - broker
      - object-storage
      - publishing-egress

  worker-source-check:
    <<: *app
    environment:
      <<: [*runtime-environment, *collection-environment]
    command: ["celery", "-A", "wisdome_writer", "worker", "--loglevel=INFO", "--queues=outbox.dispatch,source.check"]
    networks:
      - database
      - broker
      - collection-egress

  worker-collect:
    <<: *app
    environment:
      <<: [*runtime-environment, *collection-environment]
    command: ["celery", "-A", "wisdome_writer", "worker", "--loglevel=INFO", "--queues=collect.housing,collect.semiconductor"]
    networks:
      - database
      - broker
      - object-storage
      - collection-egress

  worker-evidence-fanout:
    <<: *app
    environment:
      <<: *runtime-environment
    command: ["celery", "-A", "wisdome_writer", "worker", "--loglevel=INFO", "--queues=extract.fanout"]
    networks:
      - database
      - broker
      - object-storage
      - collection-egress

  worker-extract:
    <<: *app
    environment:
      <<: *runtime-environment
      HWP_SANDBOX_SOCKET_PATH: /run/wisdome-hwp/converter.sock
      HWP_INPUT_STAGING_ROOT: /var/lib/wisdome-hwp-input
      HWP_CONVERTER_MANIFEST_PATH: /run/wisdome-hwp-manifest/converter-manifest.json
      HWP_CONVERTER_MANIFEST_SHA256: ${HWP_CONVERTER_MANIFEST_SHA256:?set the release-reviewed HWP converter manifest SHA-256}
    command: ["celery", "-A", "wisdome_writer", "worker", "--loglevel=INFO", "--queues=extract.document,extract.generic", "--concurrency=1"]
    volumes:
      - hwp-sandbox-socket:/run/wisdome-hwp:ro
      - hwp-sandbox-input:/var/lib/wisdome-hwp-input
      - ${HWP_CONVERTER_MANIFEST_PATH:?set the exported HWP converter manifest path}:/run/wisdome-hwp-manifest/converter-manifest.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-bootstrap:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      hwp-converter:
        condition: service_healthy
    networks:
      - database
      - broker
      - object-storage

  hwp-converter:
    build:
      context: .
      dockerfile: deploy/containers/hwp-worker/Dockerfile
    environment:
      HWP_JOB_TIMEOUT_SECONDS: "180"
      HWP_MAX_INPUT_BYTES: "134217728"
      HWP_MAX_OUTPUT_BYTES: "314572800"
      HWP_MAX_REPORT_BYTES: "65536"
      HWP_MAX_PAGES: "2000"
      HWP_MAX_LOG_BYTES: "1048576"
      HWP_RLIMIT_CPU_SECONDS: "180"
      HWP_RLIMIT_AS_BYTES: "536870912"
      HWP_RLIMIT_FSIZE_BYTES: "314572800"
      HWP_RLIMIT_NOFILE: "64"
      HWP_RLIMIT_NPROC: "32"
      HWP_CHILD_UID: "65533"
      HWP_CHILD_GID: "65533"
      HWP_VALIDATOR_UID: "65534"
      HWP_VALIDATOR_GID: "65534"
    network_mode: none
    read_only: true
    user: "65532:65532"
    cap_drop: ["ALL"]
    cap_add: ["SETUID", "SETGID"]
    security_opt:
      - no-new-privileges:true
    pids_limit: 32
    mem_limit: 1536m
    memswap_limit: 1536m
    cpus: "1.0"
    stop_grace_period: 10s
    volumes:
      - hwp-sandbox-socket:/run/wisdome-hwp
      - hwp-sandbox-input:/input:ro
    tmpfs:
      - /work:rw,noexec,nosuid,nodev,size=768m,uid=65532,gid=65532,mode=0700
    healthcheck:
      test: ["CMD", "/usr/local/bin/wisdome-hwp-sandbox", "probe", "--socket", "/run/wisdome-hwp/converter.sock", "--manifest", "/opt/wisdome/manifest/converter-manifest.json"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  profile-admin:
    <<: *app
    profiles: ["admin"]
    environment:
      <<: *runtime-environment
      PADDLEOCR_HOME: /models/paddleocr
      PADDLEOCR_MODEL_MANIFEST_ROOT: /models/paddleocr
      PADDLE_PDX_CACHE_HOME: /models/paddleocr
      PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: "true"
      HWP_SANDBOX_SOCKET_PATH: /run/wisdome-hwp/converter.sock
      HWP_INPUT_STAGING_ROOT: /var/lib/wisdome-hwp-input
      HWP_CONVERTER_MANIFEST_PATH: /run/wisdome-hwp-manifest/converter-manifest.json
      HWP_CONVERTER_MANIFEST_SHA256: ${HWP_CONVERTER_MANIFEST_SHA256:?set the release-reviewed HWP converter manifest SHA-256}
    command:
      - /bin/sh
      - -ec
      - |
        python src/manage.py import_extraction_profiles --root config/extraction-profiles
        python src/manage.py verify_extraction_profile_files --root config/extraction-profiles
    volumes:
      - paddle-models:/models/paddleocr:ro
      - hwp-sandbox-socket:/run/wisdome-hwp:ro
      - hwp-sandbox-input:/var/lib/wisdome-hwp-input:ro
      - ${HWP_CONVERTER_MANIFEST_PATH:?set the exported HWP converter manifest path}:/run/wisdome-hwp-manifest/converter-manifest.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-bootstrap:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      ocr-model-bootstrap:
        condition: service_completed_successfully
      hwp-converter:
        condition: service_healthy
    networks:
      - database
      - broker
      - object-storage
    restart: "no"

  worker-editorial:
    <<: *app
    environment:
      <<: *runtime-environment
    command: ["celery", "-A", "wisdome_writer", "worker", "--loglevel=INFO", "--queues=editorial,maintenance,source.change"]
    networks:
      - database
      - broker
      - object-storage

  worker-publish:
    <<: *app
    environment:
      <<: *runtime-environment
    command: ["celery", "-A", "wisdome_writer", "worker", "--loglevel=INFO", "--queues=publish.media.wordpress,publish.wordpress"]
    networks:
      - database
      - broker
      - object-storage
      - publishing-egress

  worker-publish-blogger:
    <<: *app
    environment:
      <<: [*runtime-environment, *blogger-environment]
    command: ["celery", "-A", "wisdome_writer", "worker", "--loglevel=INFO", "--queues=publish.blogger"]
    networks:
      - database
      - broker
      - object-storage
      - publishing-egress

  worker-reconcile:
    <<: *app
    environment:
      # Reconcile handles both publication channels, so it needs the Blogger
      # credential resolver inputs. The WordPress-only publish worker does not.
      <<: [*runtime-environment, *blogger-environment]
    command: ["celery", "-A", "wisdome_writer", "worker", "--loglevel=INFO", "--queues=reconcile"]
    networks:
      - database
      - broker
      - object-storage
      - publishing-egress

  ocr-worker:
    build:
      context: .
      dockerfile: deploy/containers/paddleocr-worker/Dockerfile
    environment:
      <<: *runtime-environment
      PADDLEOCR_HOME: /models/paddleocr
      PADDLEOCR_MODEL_MANIFEST_ROOT: /models/paddleocr
      PADDLE_PDX_CACHE_HOME: /models/paddleocr
      PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: "true"
    command: ["celery", "-A", "wisdome_writer", "worker", "--loglevel=INFO", "--queues=extract.ocr.paddle", "--concurrency=1"]
    volumes:
      - paddle-models:/models/paddleocr:ro
    depends_on:
      ocr-model-bootstrap:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-bootstrap:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    networks:
      - database
      - broker
      - object-storage
    restart: unless-stopped

  ocr-model-bootstrap:
    build:
      context: .
      dockerfile: deploy/containers/paddleocr-model-bootstrap/Dockerfile
    environment:
      PADDLEOCR_HOME: /models/paddleocr
      PADDLEOCR_MODEL_MANIFEST_ROOT: /models/paddleocr
      PADDLE_PDX_CACHE_HOME: /models/paddleocr
      PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: "true"
    volumes:
      - paddle-models:/models/paddleocr
    restart: "no"

  beat:
    <<: *app
    environment:
      <<: *runtime-environment
    command: ["celery", "-A", "wisdome_writer", "beat", "--loglevel=INFO"]
    networks:
      - database
      - broker

volumes:
  postgres-data:
  redis-data:
  minio-data:
  paddle-models:
  hwp-sandbox-socket:
  hwp-sandbox-input:

networks:
  web:
  collection-egress:
  publishing-egress:
  database:
    internal: true
  broker:
    internal: true
  object-storage:
    internal: true
