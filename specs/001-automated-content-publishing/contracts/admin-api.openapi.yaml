    CreateRevisionRequest:
      type: object
      additionalProperties: false
      description: >-
        Creates an admin_edit revision in drafting state. Claims, evidence links, visualizations,
        checks, renders, intents and approvals are regenerated for the new revision. The server
        resolves the current release EditorialPolicySnapshot and freezes sorted verification,
        eligible-evidence, and excluded/duplicate/conflict material; the client cannot choose policy
        material. The revision and editorial.revalidate_requested@1 event are atomic. Preview and
        publication remain blocked until claimGraphState, all ten exact content/evidence gates, the
        conditional visual gate, and runtime policy/evidence eligibility pass. The event contains
        exactly article_id, article_revision_id, editorial_policy_snapshot_id,
        editorial_policy_material_hash, verification_manifest_hash,
        input_evidence_manifest_hash, and excluded_material_manifest_hash.
      required: [baseRevisionNo, requestKey, title, summary, bodyBlocks, claimBindings, editReason]
      properties:
        baseRevisionNo: { type: integer, minimum: 1, maximum: 9007199254740991 }
        requestKey: { type: string, minLength: 8, maxLength: 200 }
        title: { type: string, minLength: 1 }
        summary: { type: string, minLength: 1 }
        bodyBlocks: { $ref: '#/components/schemas/ArticleRevision/properties/bodyBlocks' }
        claimBindings:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/ManualClaimBinding' }
        editReason: { type: string, minLength: 3, maxLength: 500 }
    ManualClaimBinding:
      type: object
      additionalProperties: false
      required: [claimRef, blockId, statement, claimType, evidenceIds, citationMarker, sourceSpans, semanticKey, actor, attribution, horizon, uncertaintyNote, derivedFromClaimRefs]
      properties:
        claimRef:
          type: string
          minLength: 1
          maxLength: 200
          description: Request-local unique identifier; it is not persisted as the Claim UUID.
        blockId: { type: string, minLength: 1 }
        statement: { type: string, minLength: 1 }
        claimType: { type: string, enum: [fact, company_claim, interpretation, outlook] }
        evidenceIds:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, format: uuid }
        citationMarker: { type: string, minLength: 1 }
        sourceSpans:
          type: object
          minProperties: 1
          propertyNames: { type: string, format: uuid }
          additionalProperties: { type: string, minLength: 1, maxLength: 2000 }
        semanticKey: { type: [string, 'null'] }
        actor: { type: [string, 'null'] }
        attribution: { type: [string, 'null'] }
        horizon: { type: [string, 'null'] }
        uncertaintyNote: { type: [string, 'null'] }
        derivedFromClaimRefs:
          type: array
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 200 }
          description: >-
            Request-local claimRef values. Interpretation claims may reference only fact or
            company_claim bindings from the same request; the server resolves them to immutable
            derivedFromClaimIds UUIDs in the persisted graph and response.
    CreateRevisionResult:
      type: object
      additionalProperties: false
      required: [articleId, revisionId, revisionNo, revalidationState, qualityState, revisionContentHash, inputEvidenceManifestHash, editorialPolicyHash, verificationManifestHash, excludedMaterialManifestHash]
      properties:
        articleId: { type: string, format: uuid }
        revisionId: { type: string, format: uuid }
        revisionNo: { type: integer, minimum: 1 }
        revalidationState: { type: string, enum: [queued, running, passed, blocked] }
        qualityState: { type: string, enum: [pending, passed, failed] }
        revisionContentHash: { type: string, pattern: '^[a-f0-9]{64}$' }
        inputEvidenceManifestHash: { type: string, pattern: '^[a-f0-9]{64}$' }
        editorialPolicyHash: { type: string, pattern: '^[a-f0-9]{64}$' }
        verificationManifestHash: { type: string, pattern: '^[a-f0-9]{64}$' }
        excludedMaterialManifestHash: { type: string, pattern: '^[a-f0-9]{64}$' }
    ChannelPreview:
      type: object
      additionalProperties: false
      required: [renderId, targetId, targetSnapshotId, targetConfigHash, channelRole, renderStage, canonicalLinkState, title, sanitizedHtml, sourceLinks, includedClaimIds, canonicalSourceUrl, violations, templateHash, renderHash, sourceManifestHash]
      properties:
        renderId: { type: string, format: uuid }
        targetId: { type: string, format: uuid }
        targetSnapshotId: { type: string, format: uuid }
        targetConfigHash: { type: string, pattern: '^[a-f0-9]{64}$' }
        channelRole: { type: string, enum: [primary_canonical, secondary_distribution] }
        renderStage: { type: string, enum: [preview, final] }
        canonicalLinkState: { type: string, enum: [not_applicable, pending, resolved] }
        title: { type: string }
        sanitizedHtml: { type: string }
        sourceLinks:
          type: array
          items: { type: string, format: uri }
        includedClaimIds:
