      required: [requestKey, reason]
      properties:
        displayName: { type: string, minLength: 1, maxLength: 200 }
        canaryTargetId: { type: [string, 'null'], format: uuid }
        usernameRef: { type: [string, 'null'] }
        credentialRef: { type: [string, 'null'], description: WordPress-only secret-store reference; Blogger credential changes use the OAuth or disconnect endpoint. }
        requestKey: { type: string, minLength: 8, maxLength: 200 }
        reason: { type: string, minLength: 3, maxLength: 500 }
    TargetValidationState:
      type: string
      enum: [not_run, passed, failed, stale]
    CanaryRequest:
      type: object
      additionalProperties: false
      required: [confirmIsolatedTestTarget, requestKey, reason]
      properties:
        confirmIsolatedTestTarget: { type: boolean, const: true }
        requestKey: { type: string, minLength: 8, maxLength: 200 }
        reason: { type: string, minLength: 3, maxLength: 500 }
    AutoPublishValidationMaterial:
      type: object
      required: [topic, targetSnapshotId, targetConfigHash, sourceRegistrySnapshotId, registryManifestHash, sourceAdapterManifestHash, extractionProfileManifestHash, generationPipelineManifestHash, topicPolicyVersion, editorialPolicyHash, qualityGateManifestHash, renderContractVersion, channelContractVersion, publisherAdapterManifestHash, testReportObjectKey, testReportObjectVersion, testReportHash]
      properties:
        topic: { $ref: '#/components/schemas/TopicCode' }
        targetSnapshotId: { type: string, format: uuid }
        targetConfigHash: { type: string, pattern: '^[a-f0-9]{64}$' }
        sourceRegistrySnapshotId: { type: string, format: uuid }
        registryManifestHash: { type: string, pattern: '^[a-f0-9]{64}$' }
        sourceAdapterManifestHash: { type: string, pattern: '^[a-f0-9]{64}$' }
        extractionProfileManifestHash: { type: string, pattern: '^[a-f0-9]{64}$' }
        generationPipelineManifestHash: { type: string, pattern: '^[a-f0-9]{64}$' }
        topicPolicyVersion: { type: integer, minimum: 1, maximum: 9007199254740991 }
        editorialPolicyHash: { type: string, pattern: '^[a-f0-9]{64}$' }
        qualityGateManifestHash: { type: string, pattern: '^[a-f0-9]{64}$' }
        renderContractVersion: { type: string, minLength: 1 }
        channelContractVersion: { type: string, minLength: 1 }
        publisherAdapterManifestHash: { type: string, pattern: '^[a-f0-9]{64}$' }
        testReportObjectKey: { type: string, minLength: 1 }
        testReportObjectVersion: { type: string, minLength: 1 }
        testReportHash: { type: string, pattern: '^[a-f0-9]{64}$' }
    AutoPublishValidationRequest:
      type: object
      additionalProperties: false
      description: >-
        The client selects only the topic and request identity. Registry, profile, policy,
        generator, publisher, credential, canary and pilot material are resolved by the server.
      required: [topic, requestKey, reason]
      properties:
        topic: { $ref: '#/components/schemas/TopicCode' }
        requestKey: { type: string, minLength: 8, maxLength: 200 }
        reason: { type: string, minLength: 3, maxLength: 500 }
    AutoPublishValidationCreateRequest:
      allOf:
        - $ref: '#/components/schemas/AutoPublishValidationRequest'
      unevaluatedProperties: false
    AutoPublishValidation:
      allOf:
        - $ref: '#/components/schemas/AutoPublishValidationMaterial'
        - type: object
          required: [id, requestKey, materialVersion, materialDocument, materialHash, status, latestDecisionId, decisionVersion, createdAt]
          properties:
            id: { type: string, format: uuid }
            requestKey: { type: string, minLength: 8, maxLength: 200 }
            materialVersion:
              type: string
              enum: [auto-publish-validation-material-v2, legacy-client-material-v1]
            materialDocument:
              type: object
              description: >-
                Immutable server-resolved target, approved registry/profile/policy, generator,
                publisher, credential and canary/pilot evidence document. Legacy material is
                quarantined and cannot satisfy a current activation gate.
              additionalProperties: true
            materialHash: { type: string, pattern: '^[a-f0-9]{64}$' }
            status: { type: string, enum: [draft, passed, revoked, stale] }
            latestDecisionId: { type: [string, 'null'], format: uuid }
            decisionVersion: { type: integer, minimum: 0 }
            createdAt: { type: string, format: date-time }
      unevaluatedProperties: false
    AutoPublishValidationDecisionRequest:
      type: object
      additionalProperties: false
      required: [decision, expectedLatestDecisionId, requestKey, reauthProofId, reason]
      properties:
        decision: { type: string, enum: [passed, revoked] }
        expectedLatestDecisionId: { type: [string, 'null'], format: uuid }
        requestKey: { type: string, minLength: 8, maxLength: 200 }
        reauthProofId: { type: string, format: uuid }
        reason: { type: string, minLength: 3, maxLength: 500 }
    AutoPublishValidationDecision:
      type: object
      additionalProperties: false
      required: [id, validationId, version, decision, supersedesDecisionId, requestKey, decisionHash, decidedBy, decidedAt, reason]
      properties:
        id: { type: string, format: uuid }
        validationId: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
        decision: { type: string, enum: [passed, revoked] }
        supersedesDecisionId: { type: [string, 'null'], format: uuid }
        requestKey: { type: string, minLength: 8, maxLength: 200 }
        decisionHash: { type: string, pattern: '^[a-f0-9]{64}$' }
        decidedBy: { type: string, format: uuid }
        decidedAt: { type: string, format: date-time }
        reason: { type: string, minLength: 3, maxLength: 500 }
    AutoPublishActivationRequest:
      type: object
      additionalProperties: false
      required: [enabled, validationRefs, expectedLatestActivationId, requestKey, reauthProofId, reason]
      properties:
        enabled: { type: boolean }
        validationRefs:
          type: array
          items: { $ref: '#/components/schemas/AutoPublishValidationRef' }
        expectedLatestActivationId: { type: [string, 'null'], format: uuid }
        requestKey: { type: string, minLength: 8, maxLength: 200 }
        reauthProofId: { type: string, format: uuid }
        reason: { type: string, minLength: 3, maxLength: 500 }
      allOf:
        - if:
            required: [enabled]
            properties:
              enabled: { const: true }
          then:
            properties:
              validationRefs: { minItems: 1 }
          else:
            properties:
              validationRefs: { maxItems: 0 }
    AutoPublishActivation:
      type: object
      additionalProperties: false
      required: [id, targetId, targetSnapshotId, targetOperationalConfigHash, validationRefs, validationManifestHash, version, decision, supersedesActivationId, requestKey, activationHash, decidedAt]
      properties:
        id: { type: string, format: uuid }
        targetId: { type: string, format: uuid }
        targetSnapshotId: { type: string, format: uuid }
        targetOperationalConfigHash:
          type: string
          pattern: '^[a-f0-9]{64}$'
        validationRefs:
          type: array
          items: { $ref: '#/components/schemas/AutoPublishValidationRef' }
        validationManifestHash: { type: string, pattern: '^[a-f0-9]{64}$' }
        version: { type: integer, minimum: 1 }
        decision: { type: string, enum: [enabled, revoked] }
        supersedesActivationId: { type: [string, 'null'], format: uuid }
        requestKey: { type: string, minLength: 8, maxLength: 200 }
        activationHash: { type: string, pattern: '^[a-f0-9]{64}$' }
        decidedAt: { type: string, format: date-time }
    AutoPublishActivationResult:
      type: object
      additionalProperties: false
      required: [activation, target]
      properties:
        activation: { $ref: '#/components/schemas/AutoPublishActivation' }
        target: { $ref: '#/components/schemas/PublicationTarget' }
    PublicationTarget:
      allOf:
        - $ref: '#/components/schemas/ChannelBinding'
        - type: object
          required: [id, currentSnapshotId, currentSnapshotVersion, currentConfigHash, publisherContractVersion, publisherAdapterManifestHash, credentialVersion, environment, displayName, baseUrl, connectionState, preflightState, canaryState, pilotState, capabilities, autoPublishEnabled, autoPublishActivationId, autoPublishActivationVersion]
          properties:
            id: { type: string, format: uuid }
            currentSnapshotId: { type: string, format: uuid }
            currentSnapshotVersion: { type: integer, minimum: 1 }
            currentConfigHash:
              type: string
              pattern: '^[a-f0-9]{64}$'
              description: Operational target configuration hash; the automatic-publication toggle is intentionally excluded.
            publisherContractVersion: { type: string, minLength: 1 }
            publisherAdapterManifestHash: { type: string, pattern: '^[a-f0-9]{64}$' }
            credentialVersion:
              type: [string, 'null']
              minLength: 1
              maxLength: 120
              description: Version of the secret-store bundle; credential values and references are never returned.
            environment: { type: string, enum: [test, production] }
            displayName: { type: string }
            baseUrl: { type: string, format: uri }
            remoteBlogId: { type: [string, 'null'] }
            canaryTargetId: { type: [string, 'null'], format: uuid }
            connectionState: { type: string, enum: [pending, verified, expired, revoked, blocked] }
            preflightState: { $ref: '#/components/schemas/TargetValidationState' }
            canaryState: { $ref: '#/components/schemas/TargetValidationState' }
            pilotState: { $ref: '#/components/schemas/TargetValidationState' }
            canaryPolicyVersion: { type: [string, 'null'] }
            capabilities:
              type: object
              description: Camel-case serialization of create, update, unpublish, mark_withdrawn, draft, schedule and media_upload.
              required: [create, update, unpublish, markWithdrawn, draft, schedule, mediaUpload]
              properties:
                create: { type: boolean }
                update: { type: boolean }
                unpublish: { type: boolean }
                markWithdrawn: { type: boolean }
                draft: { type: boolean }
                schedule: { type: boolean }
                mediaUpload: { type: boolean }
            autoPublishEnabled:
              type: boolean
              description: True only while the latest enabled activation matches this operational snapshot and all bound validations remain current and passed.
            autoPublishActivationId: { type: [string, 'null'], format: uuid }
            autoPublishActivationVersion: { type: [integer, 'null'], minimum: 1 }
            lastPreflightAt: { type: [string, 'null'], format: date-time }
            lastCanaryAt: { type: [string, 'null'], format: date-time }
            lastPilotAt: { type: [string, 'null'], format: date-time }

    CorrectionCase:
      type: object
      additionalProperties: false
      required: [id, articleId, kind, state, subjectHash, diffManifestHash, diffSummary, source, priorSource, supersedesCaseId, correctedRevisionId, latestDecisionId, decisionVersion, decisions, affectedClaimIds, publications, attempts, detectedAt, verifiedAt, dispatchedAt, completedAt, slaDeadlineAt, slaBreached, failureSummary]
      properties:
        id: { type: string, format: uuid }
        articleId: { type: string, format: uuid }
        kind: { type: string, enum: [correction, retraction, source_unavailable, restoration] }
        state: { type: string, enum: [detected, verifying, verified, applying, completed, rejected, failed] }
        subjectHash: { type: string, pattern: '^[a-f0-9]{64}$' }
        diffManifestHash: { type: string, pattern: '^[a-f0-9]{64}$' }
        diffSummary: { type: object, additionalProperties: true }
        source: { $ref: '#/components/schemas/CorrectionSourceSnapshot' }
        priorSource:
          oneOf:
            - { $ref: '#/components/schemas/CorrectionSourceSnapshot' }
            - { type: 'null' }
        supersedesCaseId: { type: [string, 'null'], format: uuid }
        correctedRevisionId: { type: [string, 'null'], format: uuid }
        latestDecisionId: { type: [string, 'null'], format: uuid }
        decisionVersion: { type: integer, minimum: 0, maximum: 9007199254740991 }
        decisions:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/CorrectionDecision' }
        affectedClaimIds:
          type: array
          maxItems: 200
          items: { type: string, format: uuid }
        publications:
          type: array
          maxItems: 20
          items:
            type: object
            additionalProperties: false
            required: [publicationId, targetId, channel, state, remotePostId, remoteUrl]
            properties:
              publicationId: { type: string, format: uuid }
              targetId: { type: string, format: uuid }
              channel: { type: string, enum: [wordpress, blogger] }
              state: { type: string }
              remotePostId: { type: [string, 'null'] }
              remoteUrl: { type: [string, 'null'], format: uri }
        attempts:
          type: array
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [attemptId, targetId, state, errorCode, recoveryState]
            properties:
              attemptId: { type: string, format: uuid }
              targetId: { type: string, format: uuid }
              state: { type: string }
              errorCode: { type: [string, 'null'] }
              recoveryState: { type: string }
        detectedAt: { type: string, format: date-time }
        verifiedAt: { type: [string, 'null'], format: date-time }
        dispatchedAt: { type: [string, 'null'], format: date-time }
        completedAt: { type: [string, 'null'], format: date-time }
        slaDeadlineAt: { type: string, format: date-time }
        slaBreached: { type: boolean }
        failureSummary: { type: object, additionalProperties: true }

    CorrectionSourceSnapshot:
      type: object
      additionalProperties: false
      required: [sourceItemId, sourceVersionHash, contentHash, url, status]
      properties:
        sourceItemId: { type: string, format: uuid }
        sourceVersionHash: { type: string, pattern: '^[a-f0-9]{64}$' }
        contentHash: { type: string, pattern: '^[a-f0-9]{64}$' }
        url: { type: string, format: uri }
        status: { type: string }

    CorrectionDecisionRequest:
      type: object
      additionalProperties: false
      required: [decision, expectedSubjectHash, expectedDiffManifestHash, correctedRevisionId, expectedLatestDecisionId, expectedDecisionVersion, requestKey, reauthProofId, reason]
      properties:
        decision: { type: string, enum: [verified, rejected] }
        expectedSubjectHash: { type: string, pattern: '^[a-f0-9]{64}$' }
        expectedDiffManifestHash: { type: string, pattern: '^[a-f0-9]{64}$' }
        correctedRevisionId:
          type: [string, 'null']
          format: uuid
          description: Required for verified and null for rejected.
        expectedLatestDecisionId: { type: [string, 'null'], format: uuid }
        expectedDecisionVersion: { type: integer, minimum: 0, maximum: 9007199254740991 }
        requestKey: { type: string, minLength: 8, maxLength: 200 }
        reauthProofId: { type: string, format: uuid }
        reason: { type: string, minLength: 3, maxLength: 500 }

    CorrectionDecision:
      type: object
      additionalProperties: false
      required: [id, decision, subjectHash, diffManifestHash, correctedRevisionId, supersedesDecisionId, headVersion, requestKey, requestHash, reauthProofId, decisionReason, decidedBy, decidedAt]
      properties:
        id: { type: string, format: uuid }
        decision: { type: string, enum: [verified, rejected] }
        subjectHash: { type: string, pattern: '^[a-f0-9]{64}$' }
        diffManifestHash: { type: string, pattern: '^[a-f0-9]{64}$' }
        correctedRevisionId: { type: [string, 'null'], format: uuid }
        supersedesDecisionId: { type: [string, 'null'], format: uuid }
        headVersion: { type: integer, minimum: 1, maximum: 9007199254740991 }
        requestKey: { type: string, minLength: 8, maxLength: 200 }
        requestHash: { type: string, pattern: '^[a-f0-9]{64}$' }
        reauthProofId: { type: string, format: uuid }
        decisionReason: { type: string, minLength: 3, maxLength: 500 }
        decidedBy: { type: string, format: uuid }
        decidedAt: { type: string, format: date-time }

    CorrectionDecisionResult:
      type: object
      additionalProperties: false
      required: [decision, correctionCase]
      properties:
        decision: { $ref: '#/components/schemas/CorrectionDecision' }
        correctionCase: { $ref: '#/components/schemas/CorrectionCase' }

    AuditEvent:
      type: object
      additionalProperties: false
      required: [id, occurredAt, correlationId, actorType, actorId, action, entityType, entityId, beforeHash, afterHash, reasonCode, metadataSchemaVersion, redactionPolicyVersion, redactionPolicyHash, metadataRedacted]
      properties:
        id: { type: string, format: uuid }
        occurredAt: { type: string, format: date-time }
        correlationId: { type: string, format: uuid }
        actorType: { type: string, enum: [admin, system, worker] }
        actorId: { type: [string, 'null'], format: uuid }
        action: { type: string }
        entityType: { type: string }
        entityId: { type: string, format: uuid }
        beforeHash: { type: [string, 'null'], pattern: '^[a-f0-9]{64}$' }
        afterHash: { type: [string, 'null'], pattern: '^[a-f0-9]{64}$' }
        reasonCode: { type: [string, 'null'] }
        metadataSchemaVersion: { type: string, minLength: 1 }
        redactionPolicyVersion: { type: string, minLength: 1 }
        redactionPolicyHash: { type: string, pattern: '^[a-f0-9]{64}$' }
        metadataRedacted:
          type: object
          maxProperties: 50
          description: Versioned per-action allowlist output; maximum 8 KiB and depth four are enforced by the server before insert and serialization.
          additionalProperties: true
    AuditEventPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AuditEvent' }
        nextCursor: { type: [string, 'null'] }

    RetentionPreviewRequest:
      type: object
      additionalProperties: false
      required: [scope, cutoffAt, requestKey, reason]
      properties:
        scope: { type: string, enum: [raw_evidence, unpublished_drafts, wordpress_media, public_delivery_assets, audit_expiry] }
        cutoffAt: { type: string, format: date-time }
        requestKey: { type: string, minLength: 8, maxLength: 200 }
        reason: { type: string, minLength: 3, maxLength: 500 }
    RetentionExecuteRequest:
      type: object
      additionalProperties: false
      description: requestKey is the authorization idempotency key, distinct from the preview request key.
      required: [expectedVersion, previewHash, requestKey, reauthProofId, reason]
      properties:
        expectedVersion: { type: integer, minimum: 1, maximum: 9007199254740991 }
        previewHash: { type: string, pattern: '^[a-f0-9]{64}$' }
        requestKey: { type: string, minLength: 8, maxLength: 200 }
        reauthProofId: { type: string, format: uuid }
        reason: { type: string, minLength: 3, maxLength: 500 }
    RetentionBatch:
      type: object
      additionalProperties: false
      required: [id, scope, cutoffAt, previewReason, authorizationReason, previewHash, impactManifestObjectKey, impactManifestObjectVersion, impactManifestHash, holdManifestObjectKey, holdManifestObjectVersion, holdManifestHash, expectedItemCount, expectedByteCount, state, phase, version, processedCount, skippedHoldCount, failedCount, failureCursor, errorCode, errorDetailRedacted, remediation, requestedBy, authorizedBy, authorizationRequestKey, createdAt, authorizedAt, completedAt]
      properties:
        id: { type: string, format: uuid }
        scope: { type: string, enum: [raw_evidence, unpublished_drafts, wordpress_media, public_delivery_assets, audit_expiry] }
        cutoffAt: { type: string, format: date-time }
        previewReason: { type: string, minLength: 3, maxLength: 500 }
        authorizationReason: { type: [string, 'null'], maxLength: 500 }
        previewHash: { type: string, pattern: '^[a-f0-9]{64}$' }
        impactManifestObjectKey: { type: string, minLength: 1 }
        impactManifestObjectVersion: { type: string, minLength: 1 }
        impactManifestHash: { type: string, pattern: '^[a-f0-9]{64}$' }
        holdManifestObjectKey: { type: string, minLength: 1 }
        holdManifestObjectVersion: { type: string, minLength: 1 }
        holdManifestHash: { type: string, pattern: '^[a-f0-9]{64}$' }
        expectedItemCount: { type: integer, minimum: 0 }
        expectedByteCount: { type: integer, minimum: 0 }
        state: { type: string, enum: [previewed, authorized, running, completed, failed, cancelled] }
        phase: { type: string, enum: [not_started, snapshotting, nulling, deleting, tombstoning, done] }
        version: { type: integer, minimum: 1 }
        processedCount: { type: integer, minimum: 0 }
        skippedHoldCount: { type: integer, minimum: 0 }
        failedCount: { type: integer, minimum: 0 }
        failureCursor: { type: [string, 'null'] }
        errorCode: { type: [string, 'null'] }
        errorDetailRedacted: { type: [string, 'null'] }
        remediation: { type: [string, 'null'] }
        requestedBy: { type: string, format: uuid }
        authorizedBy: { type: [string, 'null'], format: uuid }
        authorizationRequestKey: { type: [string, 'null'], minLength: 8, maxLength: 200 }
        createdAt: { type: string, format: date-time }
        authorizedAt: { type: [string, 'null'], format: date-time }
        completedAt: { type: [string, 'null'], format: date-time }
    RetentionBatchItem:
      type: object
      additionalProperties: false
      required: [entityType, entityId, objectVersion, preconditionHash, holdReason, state, resultHash, errorCode, errorDetailRedacted, remediation]
      properties:
        entityType: { type: string }
        entityId: { type: string, format: uuid }
        objectVersion: { type: [string, 'null'] }
        preconditionHash: { type: string, pattern: '^[a-f0-9]{64}$' }
        holdReason: { type: [string, 'null'] }
        state: { type: string, enum: [pending, snapshotted, unlinked, deleted, tombstoned, skipped, failed] }
        resultHash: { type: [string, 'null'], pattern: '^[a-f0-9]{64}$' }
        errorCode: { type: [string, 'null'] }
        errorDetailRedacted: { type: [string, 'null'] }
        remediation: { type: [string, 'null'] }
    RetentionBatchItemPage:
      type: object
      additionalProperties: false
      required: [batchId, impactManifestHash, holdManifestHash, items, nextCursor]
      properties:
        batchId: { type: string, format: uuid }
        impactManifestHash: { type: string, pattern: '^[a-f0-9]{64}$' }
        holdManifestHash: { type: string, pattern: '^[a-f0-9]{64}$' }
        items:
          type: array
          items: { $ref: '#/components/schemas/RetentionBatchItem' }
        nextCursor: { type: [string, 'null'] }

    AcceptedJob:
      type: object
      additionalProperties: false
      required: [jobId, correlationId, acceptedAt]
      properties:
        jobId: { type: string, format: uuid }
        correlationId: { type: string, format: uuid }
        acceptedAt: { type: string, format: date-time }
    ProblemIssue:
      type: object
      additionalProperties: false
      required: [path, code]
      properties:
        path:
          type: string
          maxLength: 512
          pattern: '^/(body|query|path)(/.*)?$'
          description: Value-free JSON Pointer or request-component path
        code:
          type: string
          pattern: '^[a-z][a-z0-9_]{0,63}$'
          description: Stable machine-readable validation code
    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, code, correlationId]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string }
        code: { type: string, pattern: '^[a-z][a-z0-9_]{0,63}$' }
        errors:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/ProblemIssue' }
        correlationId: { type: string, format: uuid }
        remediation: { type: [string, 'null'] }
