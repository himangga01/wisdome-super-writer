              const: legacy
              description: Quarantined migration sentinel only; never runtime-publishable.
        releaseDocumentHash:
          type: [string, 'null']
          pattern: '^[a-f0-9]{64}$'
          description: Null only for quarantined legacy snapshots that predate exact release-byte identity; such revisions are not publishable.
        configHash:
          type: [string, 'null']
          pattern: '^[a-f0-9]{64}$'
          description: Null only for quarantined legacy snapshots; never synthesized from materialHash.
        implementationManifestHash:
          type: [string, 'null']
          pattern: '^[a-f0-9]{64}$'
          description: Null only for quarantined legacy snapshots; never synthesized from materialHash.
        materialHash: { type: string, pattern: '^[a-f0-9]{64}$' }
