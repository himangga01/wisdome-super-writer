    EditorialPolicyRef:
      type: object
      additionalProperties: false
      description: >-
        Exact append-only release-resolved policy material. Editorial policy has no approval
        resource and no mutable head; the server rejects changed bytes under the same key/version.
      required: [snapshotId, policyKey, policyVersion, topic, releaseDocumentHash, configHash, implementationManifestHash, materialHash]
      properties:
        snapshotId: { type: string, format: uuid }
        policyKey: { type: string, minLength: 1 }
        policyVersion: { type: string, minLength: 1 }
        topic:
          oneOf:
            - $ref: '#/components/schemas/TopicCode'
