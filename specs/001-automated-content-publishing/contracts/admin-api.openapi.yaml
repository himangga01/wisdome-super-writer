        locatorType: { type: string, const: image_region }
        polygon:
          type: [array, 'null']
          minItems: 4
          items:
            type: array
            prefixItems:
              - { type: number }
              - { type: number }
            minItems: 2
            maxItems: 2
        bbox:
          type: [array, 'null']
          prefixItems:
            - { type: number }
            - { type: number }
            - { type: number }
            - { type: number }
          minItems: 4
