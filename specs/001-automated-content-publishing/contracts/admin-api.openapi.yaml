        locatorType: { type: string, const: manual }
        note: { type: string, minLength: 1, maxLength: 500 }
    HwpxEvidenceLocator:
      type: object
      additionalProperties: false
      required: [locatorType, sectionPath, paragraphId, tableId, rowIndex, columnIndex]
      properties:
        locatorType: { type: string, const: hwpx_path }
        sectionPath: { type: string, minLength: 1 }
        paragraphId: { type: [string, 'null'] }
        tableId: { type: [string, 'null'] }
        rowIndex: { type: [integer, 'null'], minimum: 0 }
        columnIndex: { type: [integer, 'null'], minimum: 0 }
        embeddedObjectId: { type: [string, 'null'] }
      oneOf:
        - properties:
            paragraphId: { type: string, minLength: 1 }
            tableId: { type: 'null' }
            rowIndex: { type: 'null' }
            columnIndex: { type: 'null' }
        - properties:
            tableId: { type: string, minLength: 1 }
            rowIndex: { type: integer, minimum: 0 }
            columnIndex: { type: integer, minimum: 0 }
    HwpConversionLocator:
      type: object
      additionalProperties: false
      required: [locatorType, inputChecksum, outputPdfChecksum, converterManifestHash, sandboxReportHash]
      properties:
        locatorType: { type: string, const: hwp_conversion }
        inputChecksum: { type: string, pattern: '^[a-f0-9]{64}$' }
        outputPdfChecksum: { type: string, pattern: '^[a-f0-9]{64}$' }
        converterManifestHash: { type: string, pattern: '^[a-f0-9]{64}$' }
        sandboxReportHash: { type: string, pattern: '^[a-f0-9]{64}$' }
    VisualizationEvidenceLocator:
      type: object
      additionalProperties: false
      required: [locatorType, visualizationRenderId, inputManifestHash, transformSpecHash]
      properties:
        locatorType: { type: string, const: visualization }
        visualizationRenderId: { type: string, format: uuid }
        inputManifestHash: { type: string, pattern: '^[a-f0-9]{64}$' }
        transformSpecHash: { type: string, pattern: '^[a-f0-9]{64}$' }
    OtherEvidenceLocator:
      oneOf:
        - $ref: '#/components/schemas/SpreadsheetEvidenceLocator'
        - $ref: '#/components/schemas/HtmlEvidenceLocator'
        - $ref: '#/components/schemas/StructuredEvidenceLocator'
        - $ref: '#/components/schemas/MediaEvidenceLocator'
        - $ref: '#/components/schemas/ImageRegionEvidenceLocator'
        - $ref: '#/components/schemas/HwpxEvidenceLocator'
        - $ref: '#/components/schemas/HwpConversionLocator'
        - $ref: '#/components/schemas/ManualEvidenceLocator'
      discriminator:
        propertyName: locatorType
        mapping:
          spreadsheet_cell: '#/components/schemas/SpreadsheetEvidenceLocator'
          html_dom: '#/components/schemas/HtmlEvidenceLocator'
          structured_path: '#/components/schemas/StructuredEvidenceLocator'
          media_time: '#/components/schemas/MediaEvidenceLocator'
          image_region: '#/components/schemas/ImageRegionEvidenceLocator'
          hwpx_path: '#/components/schemas/HwpxEvidenceLocator'
          hwp_conversion: '#/components/schemas/HwpConversionLocator'
          manual: '#/components/schemas/ManualEvidenceLocator'
    DocumentExtractionProvenance:
      type: object
      additionalProperties: false
      description: >-
        Child-run provenance. collectionRunId/runSourceItemId/sourceSnapshotId must equal the
        persisted DocumentExtraction lineage and the enclosing evidence origin lineage; the server
        rejects any mismatch before serialization.
      required:
        - documentExtractionId
        - collectionRunId
        - runSourceItemId
        - sourceSnapshotId
        - extractionRunId
        - inputKind
        - inputMimeType
        - inputChecksum
        - inputFrameCount
        - profileSnapshotId
        - profileMaterialHash
        - engine
        - fingerprintSchemaVersion
        - extractionFingerprint
        - profileKey
        - profileVersion
        - packageVersion
        - runtimeVersion
        - configHash
        - resultChecksum
        - lowConfidenceReasonsHash
        - inputPageCount
        - pageSetHash
        - requestedPageIndices
        - processedPageIndices
        - runComplete
        - runState
      properties:
        documentExtractionId: { type: string, format: uuid }
        collectionRunId: { type: string, format: uuid }
        runSourceItemId: { type: string, format: uuid }
        sourceSnapshotId: { type: string, format: uuid }
        extractionRunId: { type: string, format: uuid }
        retryOfRunId: { type: [string, 'null'], format: uuid }
        inputKind: { $ref: '#/components/schemas/DocumentInputKind' }
        inputMimeType:
          type: string
          enum: [application/pdf, image/png, image/jpeg, image/tiff]
        inputChecksum:
          type: string
          pattern: '^[a-f0-9]{64}$'
        inputFrameCount: { type: [integer, 'null'], minimum: 1 }
        profileSnapshotId: { type: string, format: uuid }
        profileMaterialHash:
          type: string
          pattern: '^[a-f0-9]{64}$'
        engine:
          allOf:
            - $ref: '#/components/schemas/ExtractionEngine'
            - type: string
              enum: [native_pdf, paddleocr_ppstructurev3]
        fingerprintSchemaVersion: { type: string, const: v1 }
        extractionFingerprint:
          type: string
          pattern: '^[a-f0-9]{64}$'
        profileKey: { type: string, minLength: 1 }
        profileVersion: { type: string, minLength: 1 }
        packageVersion: { type: string, minLength: 1 }
        runtimeVersion: { type: string, minLength: 1 }
        pipelineName: { type: [string, 'null'] }
        modelManifestHash:
          type: [string, 'null']
          pattern: '^[a-f0-9]{64}$'
        configHash:
          type: string
          pattern: '^[a-f0-9]{64}$'
        resultChecksum:
          type: string
          pattern: '^[a-f0-9]{64}$'
        lowConfidenceReasonsHash:
          type: [string, 'null']
          pattern: '^[a-f0-9]{64}$'
        languageProfile: { type: [string, 'null'] }
        inputPageCount: { type: integer, minimum: 1 }
        pageSetHash:
          type: string
          pattern: '^[a-f0-9]{64}$'
          description: >-
            Hash of the canonical requested page set. The server verifies requested and processed
            sets are identical before serializing succeeded/low_confidence provenance.
        requestedPageIndices:
          type: array
          minItems: 1
          items: { type: integer, minimum: 0 }
          uniqueItems: true
        processedPageIndices:
          type: array
          minItems: 1
          items: { type: integer, minimum: 0 }
          uniqueItems: true
        runComplete: { type: boolean, const: true }
        runState:
          type: string
          enum: [succeeded, low_confidence]
      allOf:
        - if:
            required: [inputKind]
            properties:
              inputKind: { const: standalone_image }
          then:
            properties:
              engine: { const: paddleocr_ppstructurev3 }
              inputMimeType: { enum: [image/png, image/jpeg, image/tiff] }
              inputFrameCount: { const: 1 }
              inputPageCount: { const: 1 }
              requestedPageIndices: { const: [0] }
              processedPageIndices: { const: [0] }
        - if:
            required: [inputKind]
            properties:
              inputKind: { const: pdf }
          then:
            properties:
              inputMimeType: { const: application/pdf }
              inputFrameCount: { type: 'null' }
        - if:
            required: [runState]
            properties:
              runState: { const: low_confidence }
          then:
            properties:
              lowConfidenceReasonsHash:
                type: string
                pattern: '^[a-f0-9]{64}$'
          else:
            properties:
              lowConfidenceReasonsHash: { type: 'null' }
        - if:
            properties:
              engine: { const: paddleocr_ppstructurev3 }
          then:
            required: [pipelineName, modelManifestHash, languageProfile]
            properties:
              packageVersion: { const: 3.7.0 }
              runtimeVersion:
                type: string
                pattern: '^3\.[0-9]+\.[0-9]+(?:[+.-][A-Za-z0-9.]+)?$'
              pipelineName: { const: PPStructureV3 }
              modelManifestHash:
                type: string
                pattern: '^[a-f0-9]{64}$'
              languageProfile:
                type: string
                enum: [korean_PP-OCRv5_mobile_rec, en_PP-OCRv5_mobile_rec]
    DocumentExtractionSummary:
      type: object
      additionalProperties: false
      description: >-
        Server-computed parent aggregate. Child EvidenceAsset responses reference this resource by
        documentExtractionId and never duplicate mutable completion fields. The server derives page
        sets and both manifests from persisted child runs/assets; clients cannot submit them.
        expectedPageIndices is always exactly 0..inputPageCount-1, and documentComplete=true is
        emitted only when coveredPageIndices is exactly that set and every selected asset is present
        in the selected evidence manifest with required reviews approved.
      required: [documentExtractionId, collectionRunId, runSourceItemId, sourceItemId, sourceSnapshotId, inputKind, inputMimeType, inputChecksum, inputFrameCount, inputPageCount, expectedPageIndices, coveredPageIndices, state, coverageManifestHash, selectedEvidenceManifestHash, documentComplete]
      properties:
        documentExtractionId: { type: string, format: uuid }
        collectionRunId: { type: string, format: uuid }
        runSourceItemId: { type: string, format: uuid }
        sourceItemId: { type: string, format: uuid }
        sourceSnapshotId: { type: string, format: uuid }
        inputKind: { $ref: '#/components/schemas/DocumentInputKind' }
        inputMimeType:
          type: string
          enum: [application/pdf, image/png, image/jpeg, image/tiff]
        inputChecksum: { type: string, pattern: '^[a-f0-9]{64}$' }
        inputFrameCount: { type: [integer, 'null'], minimum: 1 }
        inputPageCount: { type: integer, minimum: 1 }
        expectedPageIndices:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: integer, minimum: 0 }
        coveredPageIndices:
          type: array
          items: { type: integer, minimum: 0 }
          uniqueItems: true
        state: { type: string, enum: [queued, running, succeeded, low_confidence, failed] }
        coverageManifestHash:
          type: [string, 'null']
          pattern: '^[a-f0-9]{64}$'
        selectedEvidenceManifestHash:
          type: [string, 'null']
          pattern: '^[a-f0-9]{64}$'
        documentComplete: { type: boolean }
      allOf:
        - if:
            required: [documentComplete]
            properties:
              documentComplete: { const: true }
          then:
            properties:
              state: { const: succeeded }
              coverageManifestHash: { type: string, pattern: '^[a-f0-9]{64}$' }
              selectedEvidenceManifestHash: { type: string, pattern: '^[a-f0-9]{64}$' }
          else:
            properties:
              coverageManifestHash: { type: 'null' }
              selectedEvidenceManifestHash: { type: 'null' }
        - if:
            required: [inputKind]
            properties:
              inputKind: { const: standalone_image }
          then:
            properties:
              inputMimeType: { enum: [image/png, image/jpeg, image/tiff] }
              inputFrameCount: { const: 1 }
              inputPageCount: { const: 1 }
              expectedPageIndices: { const: [0] }
              coveredPageIndices: { enum: [[0], []] }
        - if:
            required: [inputKind]
            properties:
              inputKind: { const: pdf }
          then:
            properties:
              inputMimeType: { const: application/pdf }
              inputFrameCount: { type: 'null' }
    GenericExtractionProvenance:
      type: object
      additionalProperties: false
      description: >-
        Attempt provenance. collectionRunId/runSourceItemId/sourceSnapshotId must equal the
        persisted GenericExtractionAttempt and enclosing evidence origin lineage.
      required: [collectionRunId, runSourceItemId, sourceSnapshotId, attemptId, inputChecksum, profileSnapshotId, profileMaterialHash, fingerprintSchemaVersion, extractionFingerprint, attemptState, engine, extractorVersion, configHash, validationMode, resultChecksum, lowConfidenceReasonsHash, calibrationProfileKey, calibrationProfileVersion, calibrationProfileHash]
      properties:
        collectionRunId: { type: string, format: uuid }
        runSourceItemId: { type: string, format: uuid }
        sourceSnapshotId: { type: string, format: uuid }
        attemptId: { type: string, format: uuid }
        inputChecksum:
          type: string
          pattern: '^[a-f0-9]{64}$'
        profileSnapshotId: { type: string, format: uuid }
        profileMaterialHash:
          type: string
          pattern: '^[a-f0-9]{64}$'
        fingerprintSchemaVersion: { type: string, const: v1 }
        extractionFingerprint:
          type: string
          pattern: '^[a-f0-9]{64}$'
        attemptState:
          type: string
          enum: [succeeded, low_confidence]
        engine:
          allOf:
            - $ref: '#/components/schemas/ExtractionEngine'
            - type: string
              enum: [html_parser, structured_parser, spreadsheet_parser, hwpx_parser, legacy_hwp_converter, browser_capture, media_parser, manual_entry]
        extractorVersion: { type: string, minLength: 1 }
        configHash:
          type: string
          pattern: '^[a-f0-9]{64}$'
        validationMode: { $ref: '#/components/schemas/GenericValidationMode' }
        resultChecksum:
          type: string
          pattern: '^[a-f0-9]{64}$'
        lowConfidenceReasonsHash:
          type: [string, 'null']
          pattern: '^[a-f0-9]{64}$'
        calibrationProfileKey: { type: [string, 'null'] }
        calibrationProfileVersion: { type: [string, 'null'] }
        calibrationProfileHash:
          type: [string, 'null']
          pattern: '^[a-f0-9]{64}$'
      allOf:
        - if:
            required: [attemptState]
            properties:
              attemptState: { const: low_confidence }
          then:
            properties:
              validationMode: { const: calibrated }
              lowConfidenceReasonsHash:
                type: string
                pattern: '^[a-f0-9]{64}$'
          else:
            properties:
              lowConfidenceReasonsHash: { type: 'null' }
        - if:
            required: [validationMode]
            properties:
              validationMode: { const: calibrated }
          then:
            properties:
              calibrationProfileKey: { type: string, minLength: 1 }
              calibrationProfileVersion: { type: string, minLength: 1 }
              calibrationProfileHash:
                type: string
                pattern: '^[a-f0-9]{64}$'
          else:
            properties:
              calibrationProfileKey: { type: 'null' }
              calibrationProfileVersion: { type: 'null' }
              calibrationProfileHash: { type: 'null' }
        - if:
            required: [engine]
            properties:
              engine: { const: manual_entry }
          then:
            properties:
              validationMode: { const: manual }
              attemptState: { const: succeeded }
        - if:
            required: [validationMode]
            properties:
              validationMode: { const: manual }
          then:
            properties:
              engine: { const: manual_entry }
    GenericLowConfidenceReason:
      allOf:
        - $ref: '#/components/schemas/LowConfidenceReason'
        - type: object
          properties:
            scope: { const: generic_result }
            observedConfidence: { type: number, minimum: 0, maximum: 1 }
            threshold: { type: number, minimum: 0, maximum: 1 }
            calibrationProfileHash:
              type: string
              pattern: '^[a-f0-9]{64}$'
    VisualizationProvenance:
      type: object
      additionalProperties: false
      required: [renderId, articleRevisionId, inputManifestHash, transformSpecHash, rendererName, rendererVersion, configHash, outputChecksum, rightsManifestHash]
      properties:
        renderId: { type: string, format: uuid }
        articleRevisionId: { type: string, format: uuid }
        inputManifestHash: { type: string, pattern: '^[a-f0-9]{64}$' }
        transformSpecHash: { type: string, pattern: '^[a-f0-9]{64}$' }
        rendererName: { type: string, minLength: 1 }
        rendererVersion: { type: string, minLength: 1 }
        configHash: { type: string, pattern: '^[a-f0-9]{64}$' }
        outputChecksum: { type: string, pattern: '^[a-f0-9]{64}$' }
        rightsManifestHash: { type: string, pattern: '^[a-f0-9]{64}$' }
    EvidenceReviewDecisionRequest:
      type: object
      additionalProperties: false
      required: [subjectSchemaVersion, subjectHash, expectedLatestDecisionId, requestKey, decision, reason]
      properties:
        subjectSchemaVersion: { type: string, const: v1 }
        subjectHash:
          type: string
          pattern: '^[a-f0-9]{64}$'
          description: Must equal the current evidence reviewSubjectHash or the API returns 409.
        expectedLatestDecisionId:
          type: [string, 'null']
          format: uuid
          description: Compare-and-swap value; null means no current-subject decision is expected.
        requestKey: { type: string, minLength: 8, maxLength: 200 }
        decision: { type: string, enum: [approved, rejected] }
        reason: { type: string, minLength: 3, maxLength: 1000 }
    EvidenceReviewDecision:
      type: object
      additionalProperties: false
      required: [id, evidenceAuditSnapshotId, evidenceId, decisionProvenanceType, subjectSchemaVersion, subjectHash, extractionRunId, genericExtractionAttemptId, supersedesDecisionId, requestKey, decision, reason, reviewerAdminId, decidedAt]
      properties:
        id: { type: string, format: uuid }
        evidenceAuditSnapshotId: { type: string, format: uuid }
        evidenceId:
          type: [string, 'null']
          format: uuid
          description: Null after the 90-day raw-evidence purge; the audit snapshot remains authoritative.
        decisionProvenanceType: { type: string, enum: [raw, document, generic] }
        subjectSchemaVersion: { type: string, const: v1 }
        subjectHash:
          type: string
          pattern: '^[a-f0-9]{64}$'
        extractionRunId: { type: [string, 'null'], format: uuid }
        genericExtractionAttemptId: { type: [string, 'null'], format: uuid }
        supersedesDecisionId: { type: [string, 'null'], format: uuid }
        requestKey: { type: string, minLength: 8, maxLength: 200 }
        decision: { type: string, enum: [approved, rejected] }
        reason: { type: string, minLength: 3, maxLength: 1000 }
        reviewerAdminId: { type: string, format: uuid }
        decidedAt: { type: string, format: date-time }
      oneOf:
        - properties:
            decisionProvenanceType: { const: raw }
            extractionRunId: { type: 'null' }
            genericExtractionAttemptId: { type: 'null' }
        - properties:
            decisionProvenanceType: { const: document }
            extractionRunId: { type: string, format: uuid }
            genericExtractionAttemptId: { type: 'null' }
        - properties:
            decisionProvenanceType: { const: generic }
            extractionRunId: { type: 'null' }
            genericExtractionAttemptId: { type: string, format: uuid }
    EvidenceReviewDecisionSummary:
      type: object
      additionalProperties: false
      description: >-
        Embedded current-subject projection. Evidence/subject/provenance identifiers are omitted so
        they cannot conflict with the enclosing EvidenceAsset; GET/POST decision responses expose
        the full append-only record.
      required: [id, decision, reason, reviewerAdminId, decidedAt]
      properties:
        id: { type: string, format: uuid }
        decision: { type: string, enum: [approved, rejected] }
        reason: { type: string, minLength: 3, maxLength: 1000 }
        reviewerAdminId: { type: string, format: uuid }
        decidedAt: { type: string, format: date-time }
    LowConfidenceReason:
      type: object
      additionalProperties: false
      required: [impact, code, scope, fieldOrBlockRef, message, observedConfidence, threshold, calibrationProfileHash]
      properties:
        impact: { type: string, enum: [high, standard] }
        code: { type: string, pattern: '^[a-z0-9_.-]+$' }
        scope:
          type: string
          enum: [document_block, field, table, chart, formula, generic_result]
        fieldOrBlockRef: { type: [string, 'null'] }
        message: { type: string, minLength: 1, maxLength: 500 }
        observedConfidence: { type: [number, 'null'], minimum: 0, maximum: 1 }
        threshold: { type: [number, 'null'], minimum: 0, maximum: 1 }
        calibrationProfileHash:
          type: [string, 'null']
          pattern: '^[a-f0-9]{64}$'
    EvidenceAsset:
      type: object
      additionalProperties: false
      description: >-
        Detailed server read model. Origin IDs are derived from originRunSourceItemId and cannot be
        client authored; derived extraction lineage must be identical to that origin join.
      required: [id, sourceItemId, originCollectionRunId, originRunSourceItemId, originSourceSnapshotId, sourceChecksum, derivationType, kind, contentHash, sourceTitle, sourceUrl, rightsStatus, lowConfidenceReasons, reviewSubjectSchemaVersion, reviewSubjectHash, latestManualReviewDecision, manualReviewRequired, publishable, reviewState]
      properties:
        id: { type: string, format: uuid }
        sourceItemId: { type: [string, 'null'], format: uuid }
        originCollectionRunId: { type: [string, 'null'], format: uuid }
        originRunSourceItemId: { type: [string, 'null'], format: uuid }
        originSourceSnapshotId: { type: [string, 'null'], format: uuid }
        sourceChecksum:
          type: [string, 'null']
          pattern: '^[a-f0-9]{64}$'
        derivationType: { $ref: '#/components/schemas/EvidenceDerivationType' }
        kind: { $ref: '#/components/schemas/EvidenceKind' }
        contentHash:
          type: string
          pattern: '^[a-f0-9]{64}$'
        sourceTitle: { type: [string, 'null'] }
        sourceUrl: { type: [string, 'null'], format: uri }
        publisher: { type: string }
        publishedAt: { type: [string, 'null'], format: date-time }
        locator:
          oneOf:
            - $ref: '#/components/schemas/DocumentEvidenceLocator'
            - $ref: '#/components/schemas/OtherEvidenceLocator'
            - $ref: '#/components/schemas/VisualizationEvidenceLocator'
            - type: 'null'
        excerpt: { type: [string, 'null'], maxLength: 2000 }
        extraction:
          description: Required for derived evidence; raw source assets may be null.
          oneOf:
            - $ref: '#/components/schemas/DocumentExtractionProvenance'
            - $ref: '#/components/schemas/GenericExtractionProvenance'
            - $ref: '#/components/schemas/VisualizationProvenance'
            - type: 'null'
        rightsStatus: { $ref: '#/components/schemas/RightsStatus' }
        rightsBasisUrl: { type: [string, 'null'], format: uri }
        attribution: { type: [string, 'null'] }
        altText: { type: [string, 'null'] }
        confidence: { type: [number, 'null'], minimum: 0, maximum: 1 }
        confidenceDetail: { type: [object, 'null'], additionalProperties: true }
        lowConfidenceReasons:
          type: array
          description: >-
            The complete non-sensitive immutable reason manifest, ordered with high-impact reasons
            first and deterministic tie-breaks. Its Unicode-NFC RFC-8785-JCS SHA-256 must equal the
            provenance lowConfidenceReasonsHash; approval is forbidden if the full array cannot be
            loaded and verified.
          items: { $ref: '#/components/schemas/LowConfidenceReason' }
        reviewSubjectSchemaVersion: { type: string, const: v1 }
        reviewSubjectHash:
          type: string
          pattern: '^[a-f0-9]{64}$'
          description: >-
            SHA-256 of Unicode-NFC and RFC-8785-JCS canonical JSON v1 over immutable
            source/evidence/child-extraction fields only.
            Document completion, coverage, rights, review, publication projections, decisions and
            timestamps are excluded so an approval cannot invalidate itself.
        latestManualReviewDecision:
          description: >-
            Current-subject decision only; historical or stale decisions remain in the audit log.
            The compact projection omits repeated evidence/subject/provenance IDs. The server checks
            the underlying full decision row: matching EvidenceAuditSnapshot and subject version/hash;
            before purge its nullable evidenceId also matches the enclosing asset; document
            extractionRunId equals extraction.extractionRunId with generic ID null, generic evidence
            uses the inverse, and raw evidence has both null. These are transactional invariants.
          oneOf:
            - $ref: '#/components/schemas/EvidenceReviewDecisionSummary'
            - type: 'null'
        reviewState: { type: string, enum: [pending, passed, rejected, manual_required] }
        manualReviewRequired:
          type: boolean
          description: Must be true for low-confidence or conflicting high-impact values until explicit administrator review; cross-evidence cannot clear it automatically.
        publishable:
          type: boolean
          description: >-
            Server projection only. For document-derived evidence, true requires loading the parent
            DocumentExtractionSummary, verifying documentComplete=true and confirming this evidence
            ID/checksum/locator is present in selectedEvidenceManifestHash with every selected
            low-confidence child approved. Clients cannot set this value.
        exclusionReason: { type: [string, 'null'] }
      allOf:
        - if:
            required: [derivationType]
            properties:
              derivationType: { enum: [raw, document_derived, other_derived] }
          then:
            properties:
              sourceItemId: { type: string, format: uuid }
              originCollectionRunId: { type: string, format: uuid }
              originRunSourceItemId: { type: string, format: uuid }
              originSourceSnapshotId: { type: string, format: uuid }
              sourceChecksum: { type: string, pattern: '^[a-f0-9]{64}$' }
              sourceTitle: { type: string }
              sourceUrl: { type: string, format: uri }
        - if:
            required: [derivationType]
            properties:
              derivationType: { const: raw }
          then:
            properties:
              extraction: { type: 'null' }
              lowConfidenceReasons: { maxItems: 0 }
        - if:
            required: [derivationType]
            properties:
              derivationType: { const: document_derived }
          then:
            required: [extraction, locator, confidence]
            properties:
              extraction: { $ref: '#/components/schemas/DocumentExtractionProvenance' }
              locator: { $ref: '#/components/schemas/DocumentEvidenceLocator' }
              confidence: { type: number, minimum: 0, maximum: 1 }
        - if:
            required: [derivationType, extraction]
            properties:
              derivationType: { const: document_derived }
              extraction:
                type: object
                required: [inputKind]
                properties:
                  inputKind: { const: standalone_image }
          then:
            properties:
              locator:
                allOf:
                  - $ref: '#/components/schemas/DocumentEvidenceLocator'
                  - properties:
                      pageIndex: { const: 0 }
        - if:
            required: [derivationType, extraction]
            properties:
              derivationType: { const: document_derived }
              extraction:
                type: object
                required: [runState]
                properties:
                  runState: { const: succeeded }
          then:
            properties:
              lowConfidenceReasons: { maxItems: 0 }
        - if:
            required: [derivationType, extraction]
            properties:
              derivationType: { const: document_derived }
              extraction:
                type: object
                required: [runState]
                properties:
                  runState: { const: low_confidence }
          then:
            properties:
              lowConfidenceReasons: { minItems: 1 }
        - if:
            required: [derivationType]
            properties:
              derivationType: { const: other_derived }
          then:
            required: [extraction, locator]
            properties:
              extraction: { $ref: '#/components/schemas/GenericExtractionProvenance' }
              locator: { $ref: '#/components/schemas/OtherEvidenceLocator' }
        - if:
            required: [derivationType, extraction]
            properties:
              derivationType: { const: other_derived }
              extraction:
                type: object
                required: [attemptState]
                properties:
                  attemptState: { const: succeeded }
          then:
            properties:
              lowConfidenceReasons: { maxItems: 0 }
        - if:
            required: [derivationType, extraction]
            properties:
              derivationType: { const: other_derived }
              extraction:
                type: object
                required: [attemptState]
                properties:
                  attemptState: { const: low_confidence }
          then:
            properties:
              lowConfidenceReasons:
                minItems: 1
                items: { $ref: '#/components/schemas/GenericLowConfidenceReason' }
        - if:
            required: [derivationType, extraction]
            properties:
              derivationType: { const: other_derived }
              extraction:
                type: object
                required: [validationMode]
                properties:
                  validationMode: { const: calibrated }
          then:
            required: [confidence]
            properties:
              confidence: { type: number, minimum: 0, maximum: 1 }
        - if:
            required: [derivationType, extraction]
            properties:
              derivationType: { const: other_derived }
              extraction:
                type: object
                required: [validationMode]
                properties:
                  validationMode: { enum: [deterministic, manual] }
          then:
            properties:
              confidence: { type: 'null' }
        - if:
            required: [derivationType, extraction]
            properties:
              derivationType: { const: other_derived }
              extraction:
                type: object
                required: [engine]
                properties:
                  engine: { const: html_parser }
          then:
            properties:
              locator: { $ref: '#/components/schemas/HtmlEvidenceLocator' }
        - if:
            required: [derivationType, extraction]
            properties:
              derivationType: { const: other_derived }
              extraction:
                type: object
                required: [engine]
                properties:
                  engine: { const: structured_parser }
          then:
            properties:
              locator: { $ref: '#/components/schemas/StructuredEvidenceLocator' }
        - if:
            required: [derivationType, extraction]
            properties:
              derivationType: { const: other_derived }
              extraction:
                type: object
                required: [engine]
                properties:
                  engine: { const: spreadsheet_parser }
          then:
            properties:
              locator: { $ref: '#/components/schemas/SpreadsheetEvidenceLocator' }
        - if:
            required: [derivationType, extraction]
            properties:
              derivationType: { const: other_derived }
              extraction:
                type: object
                required: [engine]
                properties:
                  engine: { const: hwpx_parser }
          then:
            properties:
              locator: { $ref: '#/components/schemas/HwpxEvidenceLocator' }
              confidence: { type: 'null' }
        - if:
            required: [derivationType, extraction]
            properties:
              derivationType: { const: other_derived }
              extraction:
                type: object
                required: [engine]
                properties:
                  engine: { const: legacy_hwp_converter }
          then:
            properties:
              locator: { $ref: '#/components/schemas/HwpConversionLocator' }
              confidence: { type: 'null' }
        - if:
            required: [derivationType, extraction]
            properties:
              derivationType: { const: other_derived }
              extraction:
                type: object
                required: [engine]
                properties:
                  engine: { const: browser_capture }
          then:
            properties:
              locator:
                oneOf:
                  - $ref: '#/components/schemas/HtmlEvidenceLocator'
                  - $ref: '#/components/schemas/ImageRegionEvidenceLocator'
        - if:
            required: [derivationType, extraction]
            properties:
              derivationType: { const: other_derived }
              extraction:
                type: object
                required: [engine]
                properties:
                  engine: { const: media_parser }
          then:
            properties:
              locator:
                oneOf:
                  - $ref: '#/components/schemas/MediaEvidenceLocator'
                  - $ref: '#/components/schemas/ImageRegionEvidenceLocator'
        - if:
            required: [derivationType, extraction]
            properties:
              derivationType: { const: other_derived }
              extraction:
                type: object
                required: [engine]
                properties:
                  engine: { const: manual_entry }
          then:
            properties:
              locator: { $ref: '#/components/schemas/ManualEvidenceLocator' }
        - if:
            required: [derivationType]
            properties:
              derivationType: { const: visualization_derived }
          then:
            required: [extraction, locator]
            properties:
              sourceItemId: { type: 'null' }
              originCollectionRunId: { type: 'null' }
              originRunSourceItemId: { type: 'null' }
              originSourceSnapshotId: { type: 'null' }
              sourceChecksum: { type: 'null' }
              sourceTitle: { type: 'null' }
              sourceUrl: { type: 'null' }
              locator: { $ref: '#/components/schemas/VisualizationEvidenceLocator' }
              extraction: { $ref: '#/components/schemas/VisualizationProvenance' }
              confidence: { type: 'null' }
              lowConfidenceReasons: { maxItems: 0 }
        - if:
            required: [derivationType, extraction, latestManualReviewDecision]
            properties:
              derivationType: { const: document_derived }
              latestManualReviewDecision: { type: 'null' }
              extraction:
                type: object
                required: [runState]
                properties:
                  runState: { const: low_confidence }
          then:
            properties:
              manualReviewRequired: { const: true }
              publishable: { const: false }
              reviewState: { const: manual_required }
              lowConfidenceReasons: { minItems: 1 }
        - if:
            required: [derivationType, extraction, latestManualReviewDecision]
            properties:
              derivationType: { const: other_derived }
              latestManualReviewDecision: { type: 'null' }
              extraction:
                type: object
                required: [attemptState]
                properties:
                  attemptState: { const: low_confidence }
          then:
            properties:
              manualReviewRequired: { const: true }
              publishable: { const: false }
              reviewState: { const: manual_required }
              lowConfidenceReasons: { minItems: 1 }
        - if:
            required: [manualReviewRequired]
            properties:
              manualReviewRequired: { const: true }
          then:
            properties:
              publishable: { const: false }
              reviewState: { const: manual_required }
              latestManualReviewDecision: { type: 'null' }
        - if:
            required: [latestManualReviewDecision]
            properties:
              latestManualReviewDecision:
                type: object
                required: [decision]
                properties:
                  decision: { const: approved }
          then:
            properties:
              manualReviewRequired: { const: false }
              reviewState: { const: passed }
        - if:
            required: [latestManualReviewDecision]
            properties:
              latestManualReviewDecision:
                type: object
                required: [decision]
                properties:
                  decision: { const: rejected }
          then:
            properties:
              manualReviewRequired: { const: false }
              publishable: { const: false }
              reviewState: { const: rejected }
        - if:
            required: [publishable]
            properties:
              publishable: { const: true }
          then:
            required: [rightsBasisUrl]
            properties:
              manualReviewRequired: { const: false }
              reviewState: { const: passed }
              rightsStatus:
                type: string
                enum: [allowed, attribution_required]
              rightsBasisUrl: { type: string, format: uri, minLength: 1 }
        - if:
            required: [publishable, rightsStatus]
            properties:
              publishable: { const: true }
              rightsStatus: { const: attribution_required }
          then:
            required: [attribution]
            properties:
              attribution: { type: string, minLength: 1 }
        - if:
            required: [publishable, kind]
            properties:
              publishable: { const: true }
              kind: { enum: [image, chart, screenshot] }
          then:
            required: [altText]
            properties:
              altText: { type: string, minLength: 1 }
        - if:
            required: [derivationType, publishable]
            properties:
              derivationType: { const: document_derived }
              publishable: { const: true }
          then:
            required: [extraction]
            properties:
              manualReviewRequired: { const: false }
              reviewState: { const: passed }
              extraction:
                allOf:
                  - $ref: '#/components/schemas/DocumentExtractionProvenance'
                  - properties:
                      runComplete: { const: true }
                      runState: { enum: [succeeded, low_confidence] }
        - if:
            required: [derivationType, publishable, extraction]
            properties:
              derivationType: { const: document_derived }
              publishable: { const: true }
              extraction:
                type: object
                required: [runState]
                properties:
                  runState: { const: low_confidence }
          then:
            required: [latestManualReviewDecision]
            properties:
              latestManualReviewDecision:
                allOf:
                  - $ref: '#/components/schemas/EvidenceReviewDecisionSummary'
                  - properties:
                      decision: { const: approved }
        - if:
            required: [derivationType, publishable, extraction]
            properties:
              derivationType: { const: other_derived }
              publishable: { const: true }
              extraction:
                type: object
                required: [attemptState]
                properties:
                  attemptState: { const: low_confidence }
          then:
            required: [latestManualReviewDecision]
            properties:
              latestManualReviewDecision:
                allOf:
                  - $ref: '#/components/schemas/EvidenceReviewDecisionSummary'
                  - properties:
                      decision: { const: approved }
    EvidenceListItem:
      type: object
      additionalProperties: false
      required: [id, sourceItemId, originCollectionRunId, originRunSourceItemId, originSourceSnapshotId, derivationType, kind, sourceTitle, sourceUrl, rightsStatus, lowConfidenceReasonSummaries, lowConfidenceReasonCount, lowConfidenceReasonsTruncated, manualReviewRequired, publishable, reviewState]
      properties:
        id: { type: string, format: uuid }
        sourceItemId: { type: [string, 'null'], format: uuid }
        originCollectionRunId: { type: [string, 'null'], format: uuid }
        originRunSourceItemId: { type: [string, 'null'], format: uuid }
        originSourceSnapshotId: { type: [string, 'null'], format: uuid }
        derivationType: { $ref: '#/components/schemas/EvidenceDerivationType' }
        kind: { $ref: '#/components/schemas/EvidenceKind' }
        sourceTitle: { type: [string, 'null'] }
        sourceUrl: { type: [string, 'null'], format: uri }
