              - { type: number }
            minItems: 2
            maxItems: 2
        bbox:
          type: [array, 'null']
          prefixItems:
            - { type: number }
            - { type: number }
            - { type: number }
            - { type: number }
          minItems: 4
          maxItems: 4
        readingOrder: { type: integer, minimum: 0 }
        cell: { type: [object, 'null'], additionalProperties: true }
      anyOf:
        - required: [polygon]
          properties:
            polygon: { type: array }
        - required: [bbox]
          properties:
            bbox: { type: array }
    SpreadsheetEvidenceLocator:
