    ApprovalRequest:
      type: object
      additionalProperties: false
      required: [revisionNo, publicationIntentId, expectedLatestApprovalId, expectedHeadVersion, requestKey, reauthProofId, actionSubject, decision, decisionReason]
      properties:
        revisionNo: { type: integer, minimum: 1, maximum: 9007199254740991 }
        publicationIntentId: { type: string, format: uuid }
        expectedLatestApprovalId: { type: [string, 'null'], format: uuid }
        expectedHeadVersion:
          type: integer
          minimum: 0
          maximum: 9007199254740991
          description: Zero is required for the initial decision; otherwise this is the current head version.
        requestKey:
          type: string
          minLength: 8
          maxLength: 200
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:+/@~-]{7,199}$'
          description: >-
            Audit-safe, whitespace-free decision idempotency key supplied by the administrator or
            validated-auto worker.
        reauthProofId:
          type: [string, 'null']
          format: uuid
          description: >-
            Missing, null, or malformed proof values in proof-required combinations are 422.
            Syntactically valid but expired or scope/entity-mismatched proofs are 403.
        actionSubject:
          oneOf:
            - $ref: '#/components/schemas/ContentApprovalSubject'
            - $ref: '#/components/schemas/UnpublishApprovalSubject'
        decision: { type: string, enum: [approved, rejected, revoked] }
        decisionReason:
          type: string
          minLength: 3
          maxLength: 500
          pattern: '^\S(?:[^\x00-\x1f]*\S)?$'
          description: >-
            Nonblank, already-trimmed immutable reason supplied by the administrator or generated
            from the validated-auto worker policy decision. Audit-sensitive material is rejected.
      allOf:
        - if:
            required: [expectedLatestApprovalId]
            properties:
              expectedLatestApprovalId: { type: 'null' }
          then:
            properties:
              expectedHeadVersion: { const: 0 }
          else:
            properties:
              expectedHeadVersion: { type: integer, minimum: 1, maximum: 9007199254740991 }
        - if:
            required: [decision]
            properties:
              decision: { const: revoked }
          then:
            properties:
              reauthProofId: { type: string, format: uuid }
          else:
            if:
              required: [decision, actionSubject]
              properties:
                decision: { const: approved }
                actionSubject:
                  type: object
                  required: [kind]
                  properties:
                    kind: { const: unpublish_command }
            then:
              properties:
                reauthProofId: { type: string, format: uuid }
            else:
              properties:
                reauthProofId: { type: 'null' }
