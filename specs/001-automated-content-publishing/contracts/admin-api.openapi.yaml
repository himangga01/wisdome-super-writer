    PublishRequest:
      type: object
      additionalProperties: false
      description: >-
        Initial requests containing a Blogger target must also contain the
        primary WordPress target unless that exact revision already has a
        successful WordPress publication. WordPress is always dispatched first. Omitted publishAt
        and explicit null are the same canonical immediate-dispatch value. A non-null publishAt must
        be an offset-aware RFC 3339 timestamp and is canonicalized to the equivalent UTC `Z` value
        before hashing or scheduling; a timezone-less value is 422. Valid RFC 4122 UUID strings are
        accepted case-insensitively and canonicalized to lowercase before hashing, persistence, and
        response serialization.
      required: [revisionNo, publicationIntentId, targetIds, expectedTargetSnapshots, requestKey, reason]
      properties:
        revisionNo: { type: integer, minimum: 1, maximum: 9007199254740991 }
        publicationIntentId: { type: string, format: uuid }
        targetIds:
          type: array
          minItems: 1
          maxItems: 20
          uniqueItems: true
          description: Must include the WordPress primary target when Blogger is selected.
          items: { type: string, format: uuid }
        expectedTargetSnapshots:
          type: array
          minItems: 1
          maxItems: 20
          uniqueItems: true
          description: >-
            Must match the immutable target snapshots bound to the current PublicationIntent,
            target command, action-specific approval and render when applicable. Any
            current target config mismatch returns 409 before an external write.
          items: { $ref: '#/components/schemas/TargetSnapshotRef' }
        publishAt:
          type: [string, 'null']
          format: date-time
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}[Tt][0-9]{2}:[0-9]{2}:[0-9]{2}(?:\.[0-9]+)?(?:[Zz]|[+-][0-9]{2}:[0-9]{2})$'
          description: >-
            Optional strict RFC 3339 instant with `T` or `t`, seconds, and a `Z`, `z`, or `+/-HH:MM`
            timezone. Lowercase separators and different offsets are accepted, then canonicalized to
            uppercase `T` and the equivalent UTC `Z` value. Omitted and null mean immediate dispatch;
            date-only, space-separated, and timezone-less values are invalid. The scheduler publishes
            WordPress first and waits for public verification before Blogger.
        requestKey:
          type: string
          minLength: 8
          maxLength: 200
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:+/@~-]{7,199}$'
          description: Audit-safe, whitespace-free dispatch idempotency key.
        reason:
          type: string
          minLength: 3
          maxLength: 500
          pattern: '^\S(?:[^\x00-\x1f]*\S)?$'
          description: >-
            Required nonblank, already-trimmed immutable dispatch reason supplied by an administrator
            or generated by a worker policy; audit-sensitive material is rejected.

