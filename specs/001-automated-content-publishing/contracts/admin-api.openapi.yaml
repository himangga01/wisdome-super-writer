openapi: 3.1.0
info:
  title: Wisdome Super Writer Admin API
  version: 0.5.0
  license:
    name: Proprietary project contract
    identifier: LicenseRef-Proprietary
  description: >-
    Same-origin administrator API. Browser sessions are established by Django's
    login view. Every same-origin API request, including safe reads, requires both the session cookie
    and CSRF header; the OAuth callback explicitly overrides this rule. No public registration or
    anonymous write operation exists. Request JSON follows the RFC 8785 interoperable number
    domain: all integer values, including values nested in adapter-specific objects, must be between
    -9007199254740991 and 9007199254740991, and non-finite numbers are forbidden.
servers:
  - url: /api/v1
security:
  - sessionCookie: []
    csrfHeader: []
tags:
  - name: Topics
    description: Topic policies and automatic-publication eligibility.
  - name: Sources
    description: Versioned source registry and read-only connection checks.
  - name: Runs
    description: Collection pipeline execution, evidence, stop and retry controls.
  - name: Evidence
    description: Evidence provenance, publishability and append-only administrator review decisions.
  - name: Articles
    description: Immutable revisions, previews, evidence and approval decisions.
  - name: Schedules
    description: Topic schedules, overlap rules and validation state.
  - name: Publishing
    description: Publication targets and idempotent channel dispatch.
  - name: Operations
    description: High-risk operational controls such as the global kill switch.

paths:
  /auth/reauth:
    post:
      tags: [Operations]
      summary: Reauthenticate the current administrator for one scoped high-risk mutation
      operationId: reauthenticateAdmin
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReauthenticationRequest' }
      responses:
        default: { $ref: '#/components/responses/Problem' }
        '201':
          description: Session-bound proof valid for at most five minutes and consumed atomically once
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReauthenticationProof' }
        '401': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }

  /topics:
    get:
      tags: [Topics]
      summary: List supported topics
      operationId: listTopics
      responses:
        default: { $ref: '#/components/responses/Problem' }
        '200':
          description: Supported topics and their active policy versions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Topic' }
        '4XX': { $ref: '#/components/responses/Problem' }

  /sources:
    get:
      tags: [Sources]
      summary: List source definitions
      operationId: listSources
      parameters:
        - $ref: '#/components/parameters/TopicQuery'
        - name: enabled
          in: query
          schema: { type: boolean }
      responses:
        default: { $ref: '#/components/responses/Problem' }
        '200':
          description: Approved and draft source definitions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SourceDefinition' }
        '4XX': { $ref: '#/components/responses/Problem' }
    post:
      tags: [Sources]
      summary: Create a draft source definition
      operationId: createSource
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SourceDefinitionCreateRequest' }
      responses:
        default: { $ref: '#/components/responses/Problem' }
        '200':
          description: Existing source and draft snapshot for an identical request-key replay
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SourceDefinition' }
        '201':
          description: Source definition created in draft state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SourceDefinition' }
        '400': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /sources/{sourceId}:
    parameters:
      - $ref: '#/components/parameters/SourceId'
    get:
      tags: [Sources]
      summary: Get a source definition
      operationId: getSource
      responses:
        default: { $ref: '#/components/responses/Problem' }
        '200':
          description: Source definition
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SourceDefinition' }
        '404': { $ref: '#/components/responses/Problem' }
    patch:
      tags: [Sources]
      summary: Update a source definition
      operationId: updateSource
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: '#/components/schemas/SourceDefinitionPatch' }
      responses:
        default: { $ref: '#/components/responses/Problem' }
        '200':
          description: Updated draft; separate registry approval atomically creates a new topic registry version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SourceDefinition' }
        '400': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /sources/{sourceId}/check:
    parameters:
      - $ref: '#/components/parameters/SourceId'
    post:
      tags: [Sources]
      summary: Check source access and parsing
      operationId: checkSource
      responses:
        default: { $ref: '#/components/responses/Problem' }
        '202':
          description: Non-publishing source access and parser check accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AcceptedJob' }
        '409': { $ref: '#/components/responses/Problem' }

  /source-registries:
    get:
      tags: [Sources]
      summary: List draft, approved and retired source-registry snapshots
      operationId: listSourceRegistries
      parameters:
        - $ref: '#/components/parameters/TopicQuery'
      responses:
        default: { $ref: '#/components/responses/Problem' }
        '200':
          description: Immutable registry versions and draft projections
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SourceRegistrySnapshot' }
        '403': { $ref: '#/components/responses/Problem' }
    post:
      tags: [Sources]
      summary: Create an idempotent draft registry by carrying forward a complete base membership
      operationId: createSourceRegistryDraft
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SourceRegistryDraftRequest' }
      responses:
        default: { $ref: '#/components/responses/Problem' }
        '200':
          description: Existing idempotent draft
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SourceRegistrySnapshot' }
        '201':
          description: New draft with complete carried-forward membership
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SourceRegistrySnapshot' }
        '409': { $ref: '#/components/responses/Problem' }

  /source-registries/{registryId}:
    parameters:
      - $ref: '#/components/parameters/RegistryId'
    get:
      tags: [Sources]
      summary: Get an exact registry manifest and membership set
      operationId: getSourceRegistry
      responses:
        default: { $ref: '#/components/responses/Problem' }
        '200':
          description: Registry snapshot detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SourceRegistrySnapshot' }
        '404': { $ref: '#/components/responses/Problem' }

  /source-registries/{registryId}/memberships/{sourceId}:
    parameters:
      - $ref: '#/components/parameters/RegistryId'
      - $ref: '#/components/parameters/SourceId'
    put:
      tags: [Sources]
      summary: CAS-update one draft membership and recompute the complete immutable manifest candidate
      operationId: updateSourceRegistryMembership
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SourceRegistryMembershipRequest' }
      responses:
        default: { $ref: '#/components/responses/Problem' }
        '200':
          description: Updated draft with complete membership
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SourceRegistrySnapshot' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /source-registries/{registryId}/decisions:
    parameters:
      - $ref: '#/components/parameters/RegistryId'
    post:
      tags: [Sources]
      summary: Append a re-authenticated approve or retire decision for an exact registry manifest
      operationId: decideSourceRegistry
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SourceRegistryDecisionRequest' }
      responses:
        default: { $ref: '#/components/responses/Problem' }
        '200':
          description: Existing idempotent decision
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SourceRegistryDecision' }
        '201':
          description: New append-only registry decision
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SourceRegistryDecision' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /extraction-profiles:
    get:
      tags: [Evidence]
      summary: List immutable extraction profile snapshots awaiting approval or active/retired
      operationId: listExtractionProfiles
      parameters:
        - name: approvalState
          in: query
          schema: { type: string, enum: [draft, approved, retired] }
        - name: engine
          in: query
          schema: { $ref: '#/components/schemas/ExtractionEngine' }
      responses:
        default: { $ref: '#/components/responses/Problem' }
        '200':
          description: Profile material, local-model manifest and calibration report metadata
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ExtractionProfileSnapshot' }
        '403': { $ref: '#/components/responses/Problem' }

  /extraction-profiles/{profileId}:
    parameters:
      - $ref: '#/components/parameters/ProfileId'
    get:
      tags: [Evidence]
      summary: Get an immutable extraction profile and verification material
      operationId: getExtractionProfile
      responses:
        default: { $ref: '#/components/responses/Problem' }
        '200':
          description: Exact profile snapshot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExtractionProfileSnapshot' }
        '404': { $ref: '#/components/responses/Problem' }

  /extraction-profiles/{profileId}/decisions:
    parameters:
      - $ref: '#/components/parameters/ProfileId'
    post:
      tags: [Evidence]
      summary: Append a re-authenticated approve or retire decision
      operationId: decideExtractionProfile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExtractionProfileDecisionRequest' }
      responses:
        default: { $ref: '#/components/responses/Problem' }
        '200':
          description: Existing idempotent decision
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExtractionProfileDecision' }
        '201':
          description: New append-only decision
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExtractionProfileDecision' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /extraction-profiles/{profileId}/report:
    parameters:
      - $ref: '#/components/parameters/ProfileId'
    get:
      tags: [Evidence]
      summary: Read the hash-verified non-sensitive golden/calibration report before a decision
      operationId: getExtractionProfileReport
      responses:
        default: { $ref: '#/components/responses/Problem' }
        '200':
          description: Normalized samples, metrics, thresholds and pass/fail bound to the profile material hash
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/VerificationReport'
                  - type: object
                    properties:
                      subjectType: { const: extraction_profile }
        '404': { $ref: '#/components/responses/Problem' }

  /runs:
    get:
      tags: [Runs]
      summary: List collection runs
      operationId: listRuns
      parameters:
        - $ref: '#/components/parameters/TopicQuery'
        - name: state
          in: query
          schema: { $ref: '#/components/schemas/RunState' }
        - $ref: '#/components/parameters/Cursor'
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        default: { $ref: '#/components/responses/Problem' }
        '200':
          description: Collection runs
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunPage' }
        '4XX': { $ref: '#/components/responses/Problem' }
    post:
      tags: [Runs]
      summary: Start an idempotent collection run
      operationId: createRun
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRunRequest' }
      responses:
        default: { $ref: '#/components/responses/Problem' }
        '202':
          description: Idempotent run accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CollectionRun' }
        '409': { $ref: '#/components/responses/Problem' }

  /runs/{runId}:
    parameters:
      - $ref: '#/components/parameters/RunId'
    get:
      tags: [Runs]
      summary: Get run details and attempts
      operationId: getRun
      responses:
        default: { $ref: '#/components/responses/Problem' }
        '200':
          description: Run, step attempts, counters and redacted failure details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CollectionRunDetail' }
        '404': { $ref: '#/components/responses/Problem' }

  /runs/{runId}/stop:
    parameters:
      - $ref: '#/components/parameters/RunId'
    post:
      tags: [Runs]
      summary: Request a safe run stop
      operationId: stopRun
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: { type: string, minLength: 3, maxLength: 500 }
      responses:
        default: { $ref: '#/components/responses/Problem' }
        '202':
          description: Stop requested; already-started external calls are reconciled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CollectionRun' }
        '409': { $ref: '#/components/responses/Problem' }

  /runs/{runId}/retry:
    parameters:
      - $ref: '#/components/parameters/RunId'
    post:
      tags: [Runs]
      summary: Retry a safe run step
      operationId: retryRun
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [fromStep, requestKey, reauthProofId, reason]
              properties:
                fromStep:
                  type: string
                  enum: [collect, extract, validate, draft, publish, reconcile]
                targetIds:
                  type: array
                  items: { type: string, format: uuid }
                requestKey: { type: string, minLength: 8, maxLength: 200 }
                reauthProofId: { type: string, format: uuid }
                reason: { type: string, minLength: 3, maxLength: 500 }
      responses:
        default: { $ref: '#/components/responses/Problem' }
        '202':
          description: Safe retry accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AcceptedJob' }
        '409': { $ref: '#/components/responses/Problem' }

  /runs/{runId}/evidence:
    parameters:
      - $ref: '#/components/parameters/RunId'
    get:
      tags: [Evidence]
      summary: List run evidence and exclusions
      description: >-
        Resolves evidence through the requested CollectionRun's RunSourceItem rows. Each item keeps
        immutable originCollectionRunId/originRunSourceItemId/originSourceSnapshotId provenance even
        when the same SourceItem content is rediscovered by a later run.
      operationId: listRunEvidence
      parameters:
        - name: publishable
          in: query
          schema: { type: boolean }
        - name: kind
          in: query
          schema: { $ref: '#/components/schemas/EvidenceKind' }
        - $ref: '#/components/parameters/Cursor'
      responses:
        default: { $ref: '#/components/responses/Problem' }
        '200':
          description: Evidence and exclusion reasons
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EvidencePage' }
        '4XX': { $ref: '#/components/responses/Problem' }

  /evidence/{evidenceId}:
    parameters:
      - $ref: '#/components/parameters/EvidenceId'
    get:
      tags: [Evidence]
      summary: Get current evidence provenance and review subject
      operationId: getEvidence
      responses:
        default: { $ref: '#/components/responses/Problem' }
        '200':
          description: Current subject version/hash, latest decision and publishability projection
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EvidenceAsset' }
        '404': { $ref: '#/components/responses/Problem' }

  /document-extractions/{documentExtractionId}:
    parameters:
      - $ref: '#/components/parameters/DocumentExtractionId'
    get:
      tags: [Evidence]
      summary: Get the server-computed document completion aggregate
      operationId: getDocumentExtraction
      responses:
        default: { $ref: '#/components/responses/Problem' }
        '200':
          description: Parent page coverage, selected evidence manifest and completion state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentExtractionSummary' }
        '404': { $ref: '#/components/responses/Problem' }

  /evidence/{evidenceId}/review-decisions:
    parameters:
      - $ref: '#/components/parameters/EvidenceId'
    post:
      tags: [Evidence]
      summary: Append an administrator decision for the current evidence subject
      description: >-
        Locks the EvidenceAsset, creates or loads its immutable EvidenceAuditSnapshot, locks that
        durable subject, compares subject version/hash and expectedLatestDecisionId, then
        loads the complete low-confidence reason manifest, verifies its canonical hash and rejects
        approval if any reason is unavailable. It then writes the immutable decision, latest
        projection and outbox event in one transaction.
        (evidenceAuditSnapshotId, requestKey) is idempotent; the path evidence ID is only the live
        lookup key before raw retention purge.
      operationId: createEvidenceReviewDecision
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EvidenceReviewDecisionRequest' }
      responses:
        default: { $ref: '#/components/responses/Problem' }
        '200':
          description: Existing decision returned for an identical idempotent replay
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EvidenceReviewDecision' }
        '201':
          description: Immutable decision recorded and evidence projection recalculated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EvidenceReviewDecision' }
        '409':
          description: >-
            Subject version/hash or expected latest decision is stale, or the request key was reused
            with a different payload. Same key and same payload returns the existing decision. Read
            GET /evidence/{evidenceId} before retrying a stale comparison.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /articles:
    get:
      tags: [Articles]
      summary: List draft and published articles
      operationId: listArticles
      parameters:
        - $ref: '#/components/parameters/TopicQuery'
        - name: state
          in: query
          schema: { $ref: '#/components/schemas/ArticleState' }
        - $ref: '#/components/parameters/Cursor'
      responses:
        default: { $ref: '#/components/responses/Problem' }
        '200':
          description: Draft and published articles
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArticlePage' }
        '4XX': { $ref: '#/components/responses/Problem' }

  /articles/{articleId}:
    parameters:
      - $ref: '#/components/parameters/ArticleId'
    get:
      tags: [Articles]
      summary: Get an article with evidence and checks
      operationId: getArticle
      responses:
        default: { $ref: '#/components/responses/Problem' }
        '200':
          description: Current revision, claims, evidence, checks and publications
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArticleDetail' }
        '404': { $ref: '#/components/responses/Problem' }

  /articles/{articleId}/revisions:
    parameters:
      - $ref: '#/components/parameters/ArticleId'
    post:
      tags: [Articles]
      summary: Create an immutable article revision
      operationId: createArticleRevision
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRevisionRequest' }
      responses:
        default: { $ref: '#/components/responses/Problem' }
        '200':
          description: Existing revision returned for an identical request-key replay
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreateRevisionResult' }
        '201':
          description: New immutable drafting revision created; claim/evidence and all blocking quality checks are queued again
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreateRevisionResult' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /articles/{articleId}/preview:
    parameters:
      - $ref: '#/components/parameters/ArticleId'
    get:
      tags: [Articles]
      summary: Render a channel-specific preview
      operationId: previewArticle
      parameters:
        - name: targetId
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        default: { $ref: '#/components/responses/Problem' }
        '200':
          description: Sanitized channel render and limit violations
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChannelPreview' }
        '422': { $ref: '#/components/responses/Problem' }

  /articles/{articleId}/approvals:
    parameters:
      - $ref: '#/components/parameters/ArticleId'
    get:
      tags: [Articles]
      summary: List append-only approval decisions and current-head projections
      operationId: listArticleApprovals
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PageLimit'
        - name: publicationIntentId
          in: query
          schema: { type: string, format: uuid }
        - name: targetId
          in: query
          schema: { type: string, format: uuid }
      responses:
        default: { $ref: '#/components/responses/Problem' }
        '200':
          description: Descending signed-cursor approval history with authoritative current heads
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApprovalPage' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    post:
      tags: [Articles]
      summary: Record an article approval decision
      operationId: decideArticleApproval
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApprovalRequest' }
      responses:
        default: { $ref: '#/components/responses/Problem' }
        '200':
          description: Existing idempotent approval decision for the same request key and payload
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Approval' }
        '201':
          description: New append-only approval decision recorded against an exact target command and revision
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Approval' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /articles/{articleId}/publication-intents:
    parameters:
      - $ref: '#/components/parameters/ArticleId'
    get:
      tags: [Publishing]
      summary: Read the authoritative current publication intent head
      operationId: getCurrentPublicationIntent
      responses:
        default: { $ref: '#/components/responses/Problem' }
        '200':
          description: Current intent or null when the article has no intent head
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentPublicationIntentResult' }
        '403': { $ref: '#/components/responses/Problem' }
    post:
      tags: [Publishing]
      summary: Create or supersede an append-only publication intent
      operationId: createPublicationIntent
      description: >-
        Locks the article/correction subject, compares expectedLatestIntentId, and atomically inserts
        the immutable intent plus latest projection. Same requestKey and payload returns the existing
        intent; a stale CAS or changed payload returns 409.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PublicationIntentRequest' }
      responses:
        default: { $ref: '#/components/responses/Problem' }
        '200':
          description: Existing idempotent intent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicationIntent' }
        '201':
          description: New immutable intent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicationIntent' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /articles/{articleId}/publish:
    parameters:
      - $ref: '#/components/parameters/ArticleId'
    post:
      tags: [Publishing]
      summary: Dispatch approved publication jobs
      operationId: publishArticle
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PublishRequest' }
      responses:
        default: { $ref: '#/components/responses/Problem' }
        '200':
          description: Existing idempotent dispatch result; no publication job is enqueued again
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicationDispatchResult' }
        '202':
          description: New per-target idempotent publication jobs accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicationDispatchResult' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /articles/{articleId}/publications:
    parameters:
      - $ref: '#/components/parameters/ArticleId'
    get:
      tags: [Publishing]
      summary: List channel publication projections for an article
      operationId: listArticlePublications
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PageLimit'
      responses:
        default: { $ref: '#/components/responses/Problem' }
        '200':
          description: Descending signed-cursor publication page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicationPage' }
        '403': { $ref: '#/components/responses/Problem' }

  /publications/{publicationId}/attempts:
    parameters:
      - $ref: '#/components/parameters/PublicationId'
    get:
      tags: [Publishing]
      summary: List immutable execution and recovery history for one publication
      operationId: listPublicationAttempts
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PageLimit'
      responses:
        default: { $ref: '#/components/responses/Problem' }
        '200':
          description: Descending signed-cursor publication-attempt page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicationAttemptPage' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /publication-attempts/{attemptId}/retry:
    parameters:
      - $ref: '#/components/parameters/PublicationAttemptId'
    post:
      tags: [Publishing]
      summary: Request the safe retry or read-only reconcile selected by current attempt state
      operationId: retryPublicationAttempt
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PublicationAttemptRetryRequest' }
      responses:
        default: { $ref: '#/components/responses/Problem' }
        '202':
          description: Retry or reconcile accepted without changing the immutable dispatch cohort
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicationAttemptActionResult' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /corrections/{correctionId}/prepare-publication:
    parameters:
      - $ref: '#/components/parameters/CorrectionId'
    post:
      tags: [Publishing]
      summary: Prepare an immutable publication intent for a verified correction
      operationId: prepareCorrectionPublication
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuditMutationRequest' }
      responses:
        default: { $ref: '#/components/responses/Problem' }
        '200':
          description: Existing idempotent correction intent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicationIntent' }
        '201':
          description: New correction publication intent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicationIntent' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /corrections/{correctionId}/decisions:
    parameters:
      - $ref: '#/components/parameters/CorrectionId'
    post:
      tags: [Articles]
      summary: Verify or reject a frozen correction case with dual-CAS and reauthentication
      operationId: decideCorrection
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CorrectionDecisionRequest' }
      responses:
        default: { $ref: '#/components/responses/Problem' }
        '200':
          description: Exact immutable decision replay
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CorrectionDecisionResult' }
        '201':
          description: New immutable correction decision
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CorrectionDecisionResult' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /articles/{articleId}/corrections:
    parameters:
      - $ref: '#/components/parameters/ArticleId'
    get:
      tags: [Articles]
      summary: List correction and retraction history
      operationId: listArticleCorrections
      responses:
        default: { $ref: '#/components/responses/Problem' }
        '200':
          description: Correction and retraction history
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    maxItems: 100
                    items: { $ref: '#/components/schemas/CorrectionCase' }
        '4XX': { $ref: '#/components/responses/Problem' }

  /schedules:
    get:
      tags: [Schedules]
      summary: List schedules
      operationId: listSchedules
      responses:
        default: { $ref: '#/components/responses/Problem' }
        '200':
          description: Schedules
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Schedule' }
        '4XX': { $ref: '#/components/responses/Problem' }
    post:
      tags: [Schedules]
      summary: Create a topic schedule
      operationId: createSchedule
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScheduleInput' }
      responses:
        default: { $ref: '#/components/responses/Problem' }
        '201':
          description: Schedule created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Schedule' }
        '422': { $ref: '#/components/responses/Problem' }

  /schedules/{scheduleId}:
    parameters:
      - $ref: '#/components/parameters/ScheduleId'
    patch:
      tags: [Schedules]
      summary: Update a topic schedule
      operationId: updateSchedule
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: '#/components/schemas/SchedulePatch' }
          application/json:
            schema: { $ref: '#/components/schemas/SchedulePatch' }
      responses:
        default: { $ref: '#/components/responses/Problem' }
        '200':
          description: Updated schedule
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Schedule' }
        '422': { $ref: '#/components/responses/Problem' }

  /targets:
    get:
      tags: [Publishing]
      summary: List publication targets and capabilities
      operationId: listPublicationTargets
      responses:
        default: { $ref: '#/components/responses/Problem' }
        '200':
          description: Connected and blocked publication targets
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PublicationTarget' }
        '4XX': { $ref: '#/components/responses/Problem' }
    post:
      tags: [Publishing]
      summary: Create a publication target using secret-store references
      operationId: createPublicationTarget
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PublicationTargetInput' }
      responses:
        default: { $ref: '#/components/responses/Problem' }
        '201':
          description: Target created in pending state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicationTarget' }
        '422': { $ref: '#/components/responses/Problem' }

  /targets/{targetId}:
    parameters:
      - $ref: '#/components/parameters/TargetId'
    get:
      tags: [Publishing]
      summary: Read one publication target and its current operational projection
      operationId: getPublicationTarget
      responses:
        default: { $ref: '#/components/responses/Problem' }
        '200':
          description: Current target projection
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicationTarget' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    patch:
      tags: [Publishing]
      summary: Update target metadata or secret-store references
      operationId: updatePublicationTarget
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: '#/components/schemas/PublicationTargetPatch' }
          application/json:
            schema: { $ref: '#/components/schemas/PublicationTargetPatch' }
      responses:
        default: { $ref: '#/components/responses/Problem' }
        '200':
          description: Target updated; validation becomes stale when connection fields change
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicationTarget' }
        '422': { $ref: '#/components/responses/Problem' }

  /targets/{targetId}/preflight:
    parameters:
      - $ref: '#/components/parameters/TargetId'
    post:
      tags: [Publishing]
      summary: Run a read-only target connection preflight
      operationId: preflightPublicationTarget
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuditMutationRequest' }
      responses:
        default: { $ref: '#/components/responses/Problem' }
        '202':
          description: Read-only route, identity and declared-capability check accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AcceptedJob' }
        '4XX': { $ref: '#/components/responses/Problem' }

  /targets/{targetId}/canary:
    parameters:
      - $ref: '#/components/parameters/TargetId'
    post:
      tags: [Publishing]
      summary: Run a destructive write canary on a confirmed test-environment target
      operationId: canaryPublicationTarget
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CanaryRequest' }
      responses:
        default: { $ref: '#/components/responses/Problem' }
        '202':
          description: Create-update-media-publish-withdraw-cleanup canary accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AcceptedJob' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /targets/{targetId}/auto-publish-validations:
    parameters:
      - $ref: '#/components/parameters/TargetId'
    get:
      tags: [Publishing]
      summary: List immutable automatic-publication validation candidates for a target
      operationId: listAutoPublishValidations
      responses:
        default: { $ref: '#/components/responses/Problem' }
        '200':
          description: Validation candidates and their current decision/staleness projection
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AutoPublishValidation' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    post:
      tags: [Publishing]
      summary: Register an immutable automatic-publication validation candidate and test report
      operationId: createAutoPublishValidation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AutoPublishValidationCreateRequest' }
      responses:
        default: { $ref: '#/components/responses/Problem' }
        '200':
          description: Existing candidate for an identical request-key/material replay
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AutoPublishValidation' }
        '201':
          description: New immutable draft validation candidate
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AutoPublishValidation' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /targets/{targetId}/auto-publish-validations/{validationId}/decisions:
    parameters:
      - $ref: '#/components/parameters/TargetId'
      - $ref: '#/components/parameters/ValidationId'
    post:
      tags: [Publishing]
      summary: Append a re-authenticated pass or revoke decision for a validation candidate
      operationId: decideAutoPublishValidation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AutoPublishValidationDecisionRequest' }
      responses:
        default: { $ref: '#/components/responses/Problem' }
        '200':
          description: Existing idempotent decision
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AutoPublishValidationDecision' }
        '201':
          description: New append-only validation decision
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AutoPublishValidationDecision' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /targets/{targetId}/auto-publish-validations/{validationId}/report:
    parameters:
      - $ref: '#/components/parameters/TargetId'
      - $ref: '#/components/parameters/ValidationId'
    get:
      tags: [Publishing]
      summary: Read the hash-verified non-sensitive canary and regression report before a decision
      operationId: getAutoPublishValidationReport
      responses:
        default: { $ref: '#/components/responses/Problem' }
        '200':
          description: Normalized samples, metrics, thresholds and pass/fail bound to the validation material hash
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/VerificationReport'
                  - type: object
                    properties:
                      subjectType: { const: auto_publish_validation }
        '404': { $ref: '#/components/responses/Problem' }

  /targets/{targetId}/auto-publish:
    parameters:
      - $ref: '#/components/parameters/TargetId'
    put:
      tags: [Publishing]
      summary: Enable or disable automatic publication after preflight, test canary and manual pilot
      operationId: setTargetAutoPublish
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AutoPublishActivationRequest' }
      responses:
        default: { $ref: '#/components/responses/Problem' }
        '200':
          description: Existing idempotent activation decision and recalculated target projection
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AutoPublishActivationResult' }
        '201':
          description: New append-only activation decision and recalculated target projection
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AutoPublishActivationResult' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /targets/{targetId}/oauth/start:
    parameters:
      - $ref: '#/components/parameters/TargetId'
    post:
      tags: [Publishing]
      summary: Start Google OAuth for a Blogger target
      operationId: startTargetOAuth
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuditMutationRequest' }
      responses:
        default: { $ref: '#/components/responses/Problem' }
        '200':
          description: Short-lived authorization URL with signed state
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [authorizationUrl, expiresAt]
                properties:
                  authorizationUrl: { type: string, format: uri }
                  expiresAt: { type: string, format: date-time }
        '422': { $ref: '#/components/responses/Problem' }

  /publishing/oauth/google/callback:
    get:
      tags: [Publishing]
      summary: Complete Blogger OAuth using signed state
      operationId: completeTargetOAuth
      x-wisdome-allow-unknown-query-parameters: true
      security:
        - sessionCookie: []
      parameters:
        - name: code
          in: query
          required: false
          schema: { type: string, minLength: 1, maxLength: 4096 }
        - name: error
          in: query
          required: false
          schema: { type: string, minLength: 1, maxLength: 200 }
        - name: state
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 4096 }
        - name: scope
          in: query
          required: false
          schema: { type: string, maxLength: 4096 }
        - name: authuser
          in: query
          required: false
          schema: { type: string, maxLength: 64 }
        - name: hd
          in: query
          required: false
          schema: { type: string, maxLength: 253 }
        - name: prompt
          in: query
          required: false
          schema: { type: string, maxLength: 200 }
        - name: error_description
          in: query
          required: false
          schema: { type: string, maxLength: 1000 }
        - name: error_uri
          in: query
          required: false
          schema: { type: string, format: uri, maxLength: 2048 }
      responses:
        default: { $ref: '#/components/responses/Problem' }
        '200':
          description: OAuth result recorded and a safe completion page returned
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [targetId, credentialVersion, connectionState, next]
                properties:
                  targetId: { type: string, format: uuid }
                  credentialVersion: { type: string, minLength: 1, maxLength: 120 }
                  connectionState: { type: string, enum: [pending] }
                  next: { type: string, pattern: '^/console/publishing/targets/[0-9a-f-]{36}/$' }
        '302':
          description: OAuth result recorded and browser redirected to the target page
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /targets/{targetId}/connection:
    parameters:
      - $ref: '#/components/parameters/TargetId'
    delete:
      tags: [Publishing]
      summary: Revoke or detach target credentials and disable publication
      operationId: disconnectPublicationTarget
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedTargetSnapshotId, expectedTargetConfigHash, requestKey, reauthProofId, reason]
              properties:
                expectedTargetSnapshotId: { type: string, format: uuid }
                expectedTargetConfigHash: { type: string, pattern: '^[a-f0-9]{64}$' }
                requestKey: { type: string, minLength: 8, maxLength: 200 }
                reauthProofId: { type: string, format: uuid }
                reason: { type: string, minLength: 3, maxLength: 500 }
      responses:
        default: { $ref: '#/components/responses/Problem' }
        '202':
          description: Target disabled immediately; local deletion and remote revocation accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AcceptedJob' }
        '409': { $ref: '#/components/responses/Problem' }

  /operations/kill-switch:
    put:
      tags: [Operations]
      summary: Enable or disable the global kill switch
      operationId: setKillSwitch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [enabled, expectedVersion, requestKey, reauthProofId, reason]
              properties:
                enabled: { type: boolean }
                expectedVersion: { type: integer, minimum: 1, maximum: 9007199254740991 }
                requestKey: { type: string, minLength: 8, maxLength: 200 }
                reauthProofId: { type: [string, 'null'], format: uuid }
                reason: { type: string, minLength: 3, maxLength: 500 }
              allOf:
                - if:
                    required: [enabled]
                    properties:
                      enabled: { const: false }
                  then:
                    properties:
                      reauthProofId: { type: string, format: uuid }
                  else:
                    properties:
                      reauthProofId: { type: 'null' }
      responses:
        default: { $ref: '#/components/responses/Problem' }
        '200':
          description: Global dispatch/publish state changed; in-flight calls reconcile
          content:
            application/json:
              schema:
                type: object
                required: [decisionId, enabled, version, changedAt]
                properties:
                  decisionId: { type: string, format: uuid }
                  enabled: { type: boolean }
                  version: { type: integer, minimum: 1 }
                  changedAt: { type: string, format: date-time }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /retention/previews:
    post:
      tags: [Operations]
      summary: Create an immutable retention impact and hold preview
      operationId: previewRetentionBatch
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RetentionPreviewRequest' }
      responses:
        default: { $ref: '#/components/responses/Problem' }
        '200':
          description: Existing idempotent preview
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RetentionBatch' }
        '201':
          description: New previewed retention batch
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RetentionBatch' }
        '409': { $ref: '#/components/responses/Problem' }

  /audit-events:
    get:
      tags: [Operations]
      summary: Read the redacted append-only audit timeline
      operationId: listAuditEvents
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - name: correlationId
          in: query
          schema: { type: string, format: uuid }
        - name: entityType
          in: query
          schema: { type: string, minLength: 1, maxLength: 120 }
        - name: entityId
          in: query
          schema: { type: string, format: uuid }
        - name: action
          in: query
          schema: { type: string, minLength: 1, maxLength: 120 }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
      responses:
        default: { $ref: '#/components/responses/Problem' }
        '200':
          description: >-
            Descending keyset page. The signed opaque cursor binds canonical filters, initial upper
            watermark, last occurredAt/ID tuple and limit; from is inclusive and to is exclusive.
            Metadata is deny-by-default redacted and contains no body or secret.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditEventPage' }
        '403': { $ref: '#/components/responses/Problem' }

  /retention/batches/{retentionBatchId}:
    parameters:
      - $ref: '#/components/parameters/RetentionBatchId'
    get:
      tags: [Operations]
      summary: Get retention batch phase, counts, holds and resumable failure state
      operationId: getRetentionBatch
      responses:
        default: { $ref: '#/components/responses/Problem' }
        '200':
          description: Retention batch status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RetentionBatch' }
        '404': { $ref: '#/components/responses/Problem' }

  /retention/batches/{retentionBatchId}/execute:
    parameters:
      - $ref: '#/components/parameters/RetentionBatchId'
    post:
      tags: [Operations]
      summary: Authorize and execute an immutable retention batch
      operationId: executeRetentionBatch
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RetentionExecuteRequest' }
      responses:
        default: { $ref: '#/components/responses/Problem' }
        '200':
          description: Existing idempotent authorization or current batch state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RetentionBatch' }
        '202':
          description: Re-authenticated execution accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RetentionBatch' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /retention/batches/{retentionBatchId}/items:
    parameters:
      - $ref: '#/components/parameters/RetentionBatchId'
    get:
      tags: [Operations]
      summary: Page through the immutable impact items and hold reasons before execution
      operationId: listRetentionBatchItems
      parameters:
        - $ref: '#/components/parameters/Cursor'
      responses:
        default: { $ref: '#/components/responses/Problem' }
        '200':
          description: Verifiable item page whose full-set hash equals the batch impact and hold manifests
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RetentionBatchItemPage' }
        '404': { $ref: '#/components/responses/Problem' }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: sessionid
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRFToken

  parameters:
    TopicQuery:
      name: topic
      in: query
      schema: { $ref: '#/components/schemas/TopicCode' }
    Cursor:
      name: cursor
      in: query
      schema: { type: string, minLength: 1, maxLength: 4096 }
    PageLimit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    PublicationId:
      name: publicationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PublicationAttemptId:
      name: attemptId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CorrectionId:
      name: correctionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SourceId:
      name: sourceId
      in: path
      required: true
      schema: { type: string, format: uuid }
    RegistryId:
      name: registryId
      in: path
      required: true
      schema: { type: string, format: uuid }
    RunId:
      name: runId
      in: path
      required: true
      schema: { type: string, format: uuid }
    EvidenceId:
      name: evidenceId
      in: path
      required: true
      schema: { type: string, format: uuid }
    DocumentExtractionId:
      name: documentExtractionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ProfileId:
      name: profileId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ArticleId:
      name: articleId
      in: path
      required: true
      description: >-
        Valid RFC 4122 UUID input is case-insensitive. Publication intent and dispatch operations
        UUID-parse this path value into canonical lowercase form before request hashing and replay
        comparison, so case-only path differences are the same logical request.
      schema: { type: string, format: uuid }
    ScheduleId:
      name: scheduleId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TargetId:
      name: targetId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ValidationId:
      name: validationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    RetentionBatchId:
      name: retentionBatchId
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    Problem:
      description: RFC 9457-style error with no secret or full source body
      headers:
        X-Correlation-ID:
          description: Correlation identifier mirrored by the response body
          schema: { type: string, format: uuid }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    AuditMutationRequest:
      type: object
      additionalProperties: false
      required: [requestKey, reason]
      properties:
        requestKey: { type: string, minLength: 8, maxLength: 200 }
        reason: { type: string, minLength: 3, maxLength: 500 }
    ReauthenticationRequest:
      type: object
      additionalProperties: false
      required: [currentPassword, actionScopes]
      properties:
        currentPassword: { type: string, minLength: 1, writeOnly: true }
        mfaCode: { type: [string, 'null'], writeOnly: true }
        actionScopes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum: [auto_publish_change, kill_switch_disable, unpublish, bulk_retry, retention_execute, registry_decision, profile_decision, validation_decision, credential_disconnect, approval_revoke, correction_decision]
    ReauthenticationProof:
      type: object
      additionalProperties: false
      required: [id, actionScopes, issuedAt, expiresAt]
      properties:
        id: { type: string, format: uuid }
        actionScopes:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string }
        issuedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
    TopicCode:
      type: string
      enum: [housing_subscription, semiconductor_news]
    Topic:
      type: object
      required: [code, name, policyVersion]
      properties:
        code: { $ref: '#/components/schemas/TopicCode' }
        name: { type: string }
        policyVersion: { type: integer, minimum: 1 }
        autoPublishEligible: { type: boolean }

    SourceRateLimitPolicy:
      type: object
      additionalProperties: false
      required: [maxConcurrency, requestsPerMinute, burst]
      properties:
        maxConcurrency: { type: integer, minimum: 1, maximum: 50 }
        requestsPerMinute: { type: integer, minimum: 1, maximum: 10000 }
        burst: { type: integer, minimum: 1, maximum: 1000 }
    SourceAccessOriginPolicy:
      type: object
      additionalProperties: false
      required: [host, purposes, methods, pathPrefixes, robotsMode, robotsUrl]
      properties:
        host: { type: string, format: hostname }
        purposes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum: [collection, source_check, record_fetch, attachment, attachment_metadata]
        methods:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum: [GET, HEAD, POST]
        pathPrefixes:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, pattern: '^/' }
        robotsMode:
          type: string
          enum: [runtime_fetch, not_applicable_official_api]
        robotsUrl: { type: [string, 'null'], format: uri }
    SourceAccessPolicy:
      type: object
      additionalProperties: false
      required: [schemaVersion, decision, reviewedAt, userAgent, trafficScope, maxHttpAttempts, maxRetryDelaySeconds, maxRedirects, maxRequests, maxElapsedSeconds, originPolicies, termsDecision, licenseDecision]
      properties:
        schemaVersion: { type: string, const: source-access-policy-v1 }
        decision: { type: string, const: approved }
        reviewedAt: { type: string, format: date-time }
        userAgent: { type: string, minLength: 1, maxLength: 300 }
        trafficScope:
          type: string
          enum: [collection, source_check, collection_and_source_check]
        maxHttpAttempts: { type: integer, minimum: 1, maximum: 5 }
        maxRetryDelaySeconds: { type: integer, minimum: 0, maximum: 3600 }
        maxRedirects: { type: integer, minimum: 0, maximum: 20 }
        maxRequests: { type: integer, minimum: 1, maximum: 20000 }
        maxElapsedSeconds: { type: integer, minimum: 1, maximum: 3600 }
        originPolicies:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/SourceAccessOriginPolicy' }
        termsDecision:
          type: string
          enum: [approved, not_applicable, not_applicable_official_api]
        licenseDecision:
          type: string
          enum: [approved, not_applicable, not_applicable_official_api]
    SourceRightsDecision:
      type: object
      additionalProperties: false
      required: [status, basis, basisUrl, attributionText, publishable]
      properties:
        status: { $ref: '#/components/schemas/RightsStatus' }
        basis:
          type: string
          enum: [license, terms, none]
        basisUrl: { type: [string, 'null'], format: uri }
        attributionText: { type: [string, 'null'], maxLength: 1000 }
        publishable: { type: boolean }
    SourceRightsPolicy:
      type: object
      additionalProperties: false
      required: [schemaVersion, record, documentAttachment, mediaAttachment]
      properties:
        schemaVersion: { type: string, const: source-rights-policy-v1 }
        record: { $ref: '#/components/schemas/SourceRightsDecision' }
        documentAttachment: { $ref: '#/components/schemas/SourceRightsDecision' }
        mediaAttachment: { $ref: '#/components/schemas/SourceRightsDecision' }
    SourceExternalConfig:
      type: object
      required: [accessPolicy, rightsPolicy]
      properties:
        accessPolicy: { $ref: '#/components/schemas/SourceAccessPolicy' }
        rightsPolicy: { $ref: '#/components/schemas/SourceRightsPolicy' }
      additionalProperties: true
      description: >-
        Adapter-specific non-secret parameters plus mandatory frozen access and rights
        policies. Authorization headers, cookies, tokens, passwords, and secret-looking
        keys or values are rejected; secretRef is the only credential pointer.
    SourceHealthCheck:
      type: object
      additionalProperties: false
      required: [taxonomyVersion, snapshotId, configHash, accessPolicyHash, rightsPolicyHash, status, checkedAt, recordCount, etag, lastModified, contentHash, rightsDecision, errorCode]
      properties:
        taxonomyVersion: { type: string, const: source-check-taxonomy-v1 }
        snapshotId: { type: string, format: uuid }
        configHash: { type: string, pattern: '^[a-f0-9]{64}$' }
        accessPolicyHash: { type: string, pattern: '^[a-f0-9]{64}$' }
        rightsPolicyHash: { type: string, pattern: '^[a-f0-9]{64}$' }
        status: { type: string, enum: [passed, failed] }
        checkedAt: { type: string, format: date-time }
        recordCount: { type: integer, minimum: 0, maximum: 1000000 }
        etag: { type: [string, 'null'], maxLength: 500 }
        lastModified: { type: [string, 'null'], maxLength: 500 }
        contentHash: { type: [string, 'null'], pattern: '^[a-f0-9]{64}$' }
        rightsDecision: { $ref: '#/components/schemas/RightsStatus' }
        errorCode: { type: [string, 'null'], maxLength: 120 }
    SourceDefinitionInput:
      type: object
      required: [topic, name, publisher, authorityTier, independenceGroupId, ownerName, editorialControlName, baseUrl, accessMethod, adapterKey, externalConfig, secretRef, allowedMimeTypes, defaultRightsStatus, termsUrl, robotsUrl, licenseUrl, pollIntervalSeconds, rateLimitPolicy, enabled]
      properties:
        topic: { $ref: '#/components/schemas/TopicCode' }
        name: { type: string, maxLength: 200 }
        publisher: { type: string, maxLength: 200 }
        authorityTier:
          type: string
          enum: [primary_official, primary_regulatory, primary_corporate, trusted_industry, trusted_secondary, discovery_only]
        independenceGroupId: { type: string, minLength: 1, maxLength: 200 }
        ownerName: { type: string, minLength: 1, maxLength: 200 }
        editorialControlName: { type: string, minLength: 1, maxLength: 200 }
        baseUrl: { type: string, format: uri }
        accessMethod:
          type: string
          enum: [public_api, open_data_api, rss_atom, public_html, public_file]
        adapterKey: { type: string, pattern: '^[a-z0-9_.-]+$' }
        externalConfig: { $ref: '#/components/schemas/SourceExternalConfig' }
        secretRef: { type: [string, 'null'], maxLength: 300 }
        allowedMimeTypes:
          type: array
          items: { type: string }
        defaultRightsStatus: { $ref: '#/components/schemas/RightsStatus' }
        termsUrl: { type: [string, 'null'], format: uri }
        robotsUrl: { type: [string, 'null'], format: uri }
        licenseUrl: { type: [string, 'null'], format: uri }
        pollIntervalSeconds: { type: integer, minimum: 60, maximum: 9007199254740991 }
        rateLimitPolicy: { $ref: '#/components/schemas/SourceRateLimitPolicy' }
        enabled: { type: boolean }
    SourceDefinitionCreateRequest:
      allOf:
        - $ref: '#/components/schemas/SourceDefinitionInput'
        - type: object
          required: [requestKey]
          properties:
            requestKey: { type: string, minLength: 8, maxLength: 200 }
      unevaluatedProperties: false
    SourceDefinitionPatch:
      type: object
      additionalProperties: false
      required: [expectedLatestDraftSnapshotId, requestKey]
      description: topic is immutable after SourceDefinition creation and is intentionally absent.
      properties:
        expectedLatestDraftSnapshotId: { type: [string, 'null'], format: uuid }
        requestKey: { type: string, minLength: 8, maxLength: 200 }
        name: { type: string, maxLength: 200 }
        publisher: { type: string, maxLength: 200 }
        authorityTier:
          type: string
          enum: [primary_official, primary_regulatory, primary_corporate, trusted_industry, trusted_secondary, discovery_only]
        independenceGroupId: { type: string, minLength: 1, maxLength: 200 }
        ownerName: { type: string, minLength: 1, maxLength: 200 }
        editorialControlName: { type: string, minLength: 1, maxLength: 200 }
        baseUrl: { type: string, format: uri }
        accessMethod:
          type: string
          enum: [public_api, open_data_api, rss_atom, public_html, public_file]
        adapterKey: { type: string, pattern: '^[a-z0-9_.-]+$' }
        externalConfig: { $ref: '#/components/schemas/SourceExternalConfig' }
        secretRef: { type: [string, 'null'], maxLength: 300 }
        allowedMimeTypes:
          type: array
          items: { type: string }
        defaultRightsStatus: { $ref: '#/components/schemas/RightsStatus' }
        termsUrl: { type: [string, 'null'], format: uri }
        robotsUrl: { type: [string, 'null'], format: uri }
        licenseUrl: { type: [string, 'null'], format: uri }
        pollIntervalSeconds: { type: integer, minimum: 60, maximum: 9007199254740991 }
        rateLimitPolicy: { $ref: '#/components/schemas/SourceRateLimitPolicy' }
        enabled: { type: boolean }
    SourceDefinition:
      allOf:
        - $ref: '#/components/schemas/SourceDefinitionInput'
        - type: object
          required: [id, latestApprovedSnapshotVersion, latestDraftSnapshotId, latestDraftSnapshotVersion, latestDraftConfigHash, status, lastHealth]
          properties:
            id: { type: string, format: uuid }
            latestApprovedSnapshotVersion: { type: [integer, 'null'], minimum: 1 }
            latestDraftSnapshotId: { type: [string, 'null'], format: uuid }
            latestDraftSnapshotVersion: { type: [integer, 'null'], minimum: 1 }
            latestDraftConfigHash: { type: [string, 'null'], pattern: '^[a-f0-9]{64}$' }
            status: { type: string, enum: [draft, approved, retired] }
            lastHealth:
              oneOf:
                - $ref: '#/components/schemas/SourceHealthCheck'
                - type: 'null'
      unevaluatedProperties: false

    SourceRegistryDraftRequest:
      type: object
      additionalProperties: false
      required: [topic, baseRegistryId, expectedLatestRegistryVersion, expectedLatestRegistryManifestHash, requestKey]
      properties:
        topic: { $ref: '#/components/schemas/TopicCode' }
        baseRegistryId: { type: [string, 'null'], format: uuid }
        expectedLatestRegistryVersion: { type: [integer, 'null'], minimum: 1, maximum: 9007199254740991 }
        expectedLatestRegistryManifestHash: { type: [string, 'null'], pattern: '^[a-f0-9]{64}$' }
        requestKey: { type: string, minLength: 8, maxLength: 200 }
    SourceRegistryMembership:
      type: object
      additionalProperties: false
      required: [sourceId, sourceDefinitionSnapshotId, sourceDefinitionSnapshotVersion, sourceDefinitionSnapshotStatus, sourceDefinitionConfigHash, enabled, displayOrder]
      properties:
        sourceId: { type: string, format: uuid }
        sourceDefinitionSnapshotId: { type: string, format: uuid }
        sourceDefinitionSnapshotVersion: { type: integer, minimum: 1 }
        sourceDefinitionSnapshotStatus: { type: string, enum: [draft, approved, retired] }
        sourceDefinitionConfigHash: { type: string, pattern: '^[a-f0-9]{64}$' }
        enabled: { type: boolean }
        displayOrder: { type: integer, minimum: 0 }
    SourceRegistrySnapshot:
      type: object
      additionalProperties: false
      required: [id, topic, version, rowVersion, status, baseApprovedRegistryId, baseApprovedVersion, baseApprovedManifestHash, manifestHash, latestDecisionId, memberships, createdAt]
      properties:
        id: { type: string, format: uuid }
        topic: { $ref: '#/components/schemas/TopicCode' }
        version: { type: integer, minimum: 1 }
        rowVersion: { type: integer, minimum: 1 }
        status: { type: string, enum: [draft, approved, retired] }
        baseApprovedRegistryId: { type: [string, 'null'], format: uuid }
        baseApprovedVersion: { type: [integer, 'null'], minimum: 1 }
        baseApprovedManifestHash: { type: [string, 'null'], pattern: '^[a-f0-9]{64}$' }
        manifestHash: { type: string, pattern: '^[a-f0-9]{64}$' }
        latestDecisionId: { type: [string, 'null'], format: uuid }
        memberships:
          type: array
          uniqueItems: true
          items: { $ref: '#/components/schemas/SourceRegistryMembership' }
        createdAt: { type: string, format: date-time }
    SourceRegistryMembershipRequest:
      type: object
      additionalProperties: false
      required: [expectedRowVersion, expectedManifestHash, sourceDefinitionSnapshotId, enabled, displayOrder, requestKey]
      properties:
        expectedRowVersion: { type: integer, minimum: 1, maximum: 9007199254740991 }
        expectedManifestHash: { type: string, pattern: '^[a-f0-9]{64}$' }
        sourceDefinitionSnapshotId: { type: string, format: uuid }
        enabled: { type: boolean }
        displayOrder: { type: integer, minimum: 0, maximum: 9007199254740991 }
        requestKey: { type: string, minLength: 8, maxLength: 200 }
    SourceRegistryDecisionRequest:
      type: object
      additionalProperties: false
      required: [decision, expectedRowVersion, expectedManifestHash, expectedCurrentHeadRegistryId, expectedCurrentHeadVersion, expectedCurrentHeadManifestHash, expectedLatestDecisionId, requestKey, reauthProofId, reason]
      properties:
        decision: { type: string, enum: [approved, retired] }
        expectedRowVersion: { type: integer, minimum: 1, maximum: 9007199254740991 }
        expectedManifestHash: { type: string, pattern: '^[a-f0-9]{64}$' }
        expectedCurrentHeadRegistryId: { type: [string, 'null'], format: uuid }
        expectedCurrentHeadVersion: { type: [integer, 'null'], minimum: 1, maximum: 9007199254740991 }
        expectedCurrentHeadManifestHash: { type: [string, 'null'], pattern: '^[a-f0-9]{64}$' }
        expectedLatestDecisionId: { type: [string, 'null'], format: uuid }
        requestKey: { type: string, minLength: 8, maxLength: 200 }
        reauthProofId: { type: string, format: uuid }
        reason: { type: string, minLength: 3, maxLength: 500 }
    SourceRegistryDecision:
      type: object
      additionalProperties: false
      required: [id, registryId, version, decision, expectedRowVersion, expectedManifestHash, expectedCurrentHeadRegistryId, expectedCurrentHeadVersion, expectedCurrentHeadManifestHash, supersedesDecisionId, requestKey, decisionHash, decidedBy, decidedAt, reason]
      properties:
        id: { type: string, format: uuid }
        registryId: { type: string, format: uuid }
        version: { type: integer, minimum: 1, maximum: 9007199254740991 }
        decision: { type: string, enum: [approved, retired] }
        expectedRowVersion: { type: integer, minimum: 1 }
        expectedManifestHash: { type: string, pattern: '^[a-f0-9]{64}$' }
        expectedCurrentHeadRegistryId: { type: [string, 'null'], format: uuid }
        expectedCurrentHeadVersion: { type: [integer, 'null'], minimum: 1 }
        expectedCurrentHeadManifestHash: { type: [string, 'null'], pattern: '^[a-f0-9]{64}$' }
        supersedesDecisionId: { type: [string, 'null'], format: uuid }
        requestKey: { type: string, minLength: 8, maxLength: 200 }
        decisionHash: { type: string, pattern: '^[a-f0-9]{64}$' }
        decidedBy: { type: string, format: uuid }
        decidedAt: { type: string, format: date-time }
        reason: { type: string, minLength: 3, maxLength: 500 }

    CreateRunRequest:
      type: object
      description: >-
        For validated_auto, targetIds and validation/activation ref targetId sets must be identical;
        each target appears exactly once and all refs must bind the same target snapshot and the
        activation's exact validation set. The server enforces these relational invariants.
      additionalProperties: false
      required: [topic, targetIds, approvalMode, autoPublishValidationRefs, autoPublishActivationRefs, requestKey]
      properties:
        topic: { $ref: '#/components/schemas/TopicCode' }
        windowStart: { type: [string, 'null'], format: date-time }
        windowEnd: { type: [string, 'null'], format: date-time }
        targetIds:
          type: array
          description: Must include the WordPress primary target when Blogger is selected.
          items: { type: string, format: uuid }
          uniqueItems: true
        approvalMode: { type: string, enum: [manual, validated_auto] }
        autoPublishValidationRefs:
          type: array
          uniqueItems: true
          description: In validated_auto mode, exactly one current validation per targetId is required.
          items: { $ref: '#/components/schemas/AutoPublishValidationRef' }
        autoPublishActivationRefs:
          type: array
          uniqueItems: true
          description: In validated_auto mode, exactly one current enabled activation per targetId is required.
          items: { $ref: '#/components/schemas/AutoPublishActivationRef' }
        requestKey: { type: string, minLength: 8, maxLength: 200 }
      allOf:
        - if:
            required: [approvalMode]
            properties:
              approvalMode: { const: validated_auto }
          then:
            properties:
              autoPublishValidationRefs: { minItems: 1 }
              autoPublishActivationRefs: { minItems: 1 }
          else:
            properties:
              autoPublishValidationRefs: { maxItems: 0 }
              autoPublishActivationRefs: { maxItems: 0 }
    RunState:
      type: string
      enum: [queued, collecting, extracting, validating, drafting, awaiting_approval, publishing, stopping, stopped, completed, failed]
    TargetSnapshotRef:
      type: object
      additionalProperties: false
      required: [targetId, targetSnapshotId, targetConfigHash]
      properties:
        targetId: { type: string, format: uuid }
        targetSnapshotId: { type: string, format: uuid }
        targetConfigHash:
          type: string
          pattern: '^[a-f0-9]{64}$'
    TargetCommand:
      type: object
      additionalProperties: false
      required: [targetId, targetSnapshotId, targetConfigHash, resolvedAction, canonicalDependencyTargetId]
      properties:
        targetId: { type: string, format: uuid }
        targetSnapshotId: { type: string, format: uuid }
        targetConfigHash: { type: string, pattern: '^[a-f0-9]{64}$' }
        resolvedAction: { type: string, enum: [create, update, unpublish, mark_withdrawn] }
        canonicalDependencyTargetId:
          type: [string, 'null']
          format: uuid
          description: Required for Blogger create, update and mark_withdrawn; null for the primary target and unpublish.
    AutoPublishValidationRef:
      type: object
      additionalProperties: false
      required: [validationId, targetId, targetSnapshotId, materialHash]
      properties:
        validationId: { type: string, format: uuid }
        targetId: { type: string, format: uuid }
        targetSnapshotId: { type: string, format: uuid }
        materialHash: { type: string, pattern: '^[a-f0-9]{64}$' }
    AutoPublishActivationRef:
      type: object
      additionalProperties: false
      required: [activationId, targetId, targetSnapshotId, version, activationHash]
      properties:
        activationId: { type: string, format: uuid }
        targetId: { type: string, format: uuid }
        targetSnapshotId: { type: string, format: uuid }
        version: { type: integer, minimum: 1, maximum: 9007199254740991 }
        activationHash: { type: string, pattern: '^[a-f0-9]{64}$' }
    CollectionRun:
      type: object
      description: >-
        Server-computed immutable run snapshot. In validated_auto mode, requested target,
        target-snapshot, validation and activation target sets are equal and one-to-one.
      required: [id, displayId, topic, trigger, sourceRegistrySnapshotId, registryVersion, registryManifestHash, topicPolicyId, policyVersion, policyHash, freshnessMinutes, allowedAuthorityTiers, freshnessCutoff, requestedTargetIds, requestedTargetSnapshots, targetSnapshotManifestHash, approvalMode, autoPublishValidationRefs, autoPublishActivationRefs, autoActivationManifestHash, scheduleSnapshotHash, autoValidationSnapshotHash, requestFingerprint, state, createdAt]
      properties:
        id: { type: string, format: uuid }
        displayId: { type: string }
        topic: { $ref: '#/components/schemas/TopicCode' }
        trigger: { type: string, enum: [manual, schedule, source_change, retry] }
        sourceRegistrySnapshotId: { type: string, format: uuid }
        registryVersion: { type: integer, minimum: 1 }
        registryManifestHash:
          type: string
          pattern: '^[a-f0-9]{64}$'
        topicPolicyId: { type: string, format: uuid }
        policyVersion: { type: integer, minimum: 1 }
        policyHash: { type: string, pattern: '^[a-f0-9]{64}$' }
        freshnessMinutes: { type: integer, minimum: 1 }
        allowedAuthorityTiers:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum: [primary_official, primary_regulatory, primary_corporate, trusted_industry, trusted_secondary, discovery_only]
        freshnessCutoff: { type: string, format: date-time }
        requestedTargetIds:
          type: array
          items: { type: string, format: uuid }
          uniqueItems: true
        requestedTargetSnapshots:
          type: array
          uniqueItems: true
          items: { $ref: '#/components/schemas/TargetSnapshotRef' }
        targetSnapshotManifestHash:
          type: string
          pattern: '^[a-f0-9]{64}$'
        approvalMode: { type: string, enum: [manual, validated_auto] }
        autoPublishValidationRefs:
          type: array
          uniqueItems: true
          items: { $ref: '#/components/schemas/AutoPublishValidationRef' }
        autoPublishActivationRefs:
          type: array
          uniqueItems: true
          items: { $ref: '#/components/schemas/AutoPublishActivationRef' }
        autoActivationManifestHash:
          type: [string, 'null']
          pattern: '^[a-f0-9]{64}$'
        scheduleSnapshotHash:
          type: [string, 'null']
          pattern: '^[a-f0-9]{64}$'
        autoValidationSnapshotHash:
          type: [string, 'null']
          pattern: '^[a-f0-9]{64}$'
        requestFingerprint:
          type: string
          pattern: '^[a-f0-9]{64}$'
        state: { $ref: '#/components/schemas/RunState' }
        windowStart: { type: string, format: date-time }
        windowEnd: { type: string, format: date-time }
        counters: { type: object, additionalProperties: { type: integer } }
        errorSummary: { type: [object, 'null'], additionalProperties: true }
        correlationId: { type: string, format: uuid }
        durationMs: { type: [integer, 'null'], minimum: 0 }
        retryCount: { type: integer, minimum: 0 }
        terminalImpact: { type: object, additionalProperties: true }
        recoveryState: { type: string }
        nextRecoveryAt: { type: [string, 'null'], format: date-time }
        stopRequestedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        startedAt: { type: [string, 'null'], format: date-time }
        completedAt: { type: [string, 'null'], format: date-time }
      allOf:
        - if:
            required: [approvalMode]
            properties:
              approvalMode: { const: validated_auto }
          then:
            properties:
              autoValidationSnapshotHash:
                type: string
                pattern: '^[a-f0-9]{64}$'
              autoPublishValidationRefs: { minItems: 1 }
              autoPublishActivationRefs: { minItems: 1 }
              autoActivationManifestHash:
                type: string
                pattern: '^[a-f0-9]{64}$'
          else:
            properties:
              autoValidationSnapshotHash: { type: 'null' }
              autoPublishValidationRefs: { maxItems: 0 }
              autoPublishActivationRefs: { maxItems: 0 }
              autoActivationManifestHash: { type: 'null' }
        - if:
            required: [trigger]
            properties:
              trigger: { const: schedule }
          then:
