[build-system]
requires = ["setuptools==83.0.0", "wheel==0.46.3"]
build-backend = "setuptools.build_meta"

[project]
name = "wisdome-super-writer"
version = "0.1.0"
description = "Administrator-only evidence-driven content collection and publishing service"
requires-python = ">=3.12,<3.13"
dependencies = [
  "Django==5.2.16",
  "gunicorn==23.0.0",
  "whitenoise==6.12.0",
  "celery[redis]==5.6.3",
  "psycopg[binary]==3.3.4",
  "dj-database-url==2.3.0",
  "python-dotenv==1.2.2",
  "boto3==1.43.57",
  "httpx==0.28.1",
  "rfc8785==0.1.4",
  "croniter==6.2.4",
  "defusedxml==0.7.1",
  "lxml==6.1.1",
  "selectolax==0.4.11",
  "PyMuPDF==1.28.0",
  "pypdf==6.14.2",
  "pdfplumber==0.11.10",
  "openpyxl==3.1.5",
  "Pillow==12.3.0",
  "bleach==6.4.0",
  "playwright==1.61.0",
]

[project.optional-dependencies]
ocr = [
  "paddleocr[doc-parser]==3.7.0",
  "paddlepaddle==3.2.2",
]
dev = [
  "pytest==9.1.1",
  "pytest-django==4.12.0",
  "pytest-cov==7.1.0",
  "ruff==0.16.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "wisdome_writer.settings"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]
