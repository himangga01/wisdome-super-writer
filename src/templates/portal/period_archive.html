<div class="period-caption"><span><strong>{{ period_ui.label }}</strong> · {{ period_ui.basis_label }} 기준</span><div><a href="{{ period_ui.current_url }}">이번 달</a><a href="{{ period_ui.all_url }}">전체 기간</a>{% if period_ui.previous_url %}<a href="{{ period_ui.previous_url }}">← 이전</a>{% endif %}{% if period_ui.next_url %}<a href="{{ period_ui.next_url }}">다음 →</a>{% endif %}</div></div>
<details class="period-archive"><summary>연도·월 선택</summary><nav aria-label="실행 기록 연도">{% for year,url in period_ui.year_links %}<a href="{{ url }}"{% if period_selection.year == year %} aria-current="true"{% endif %}>{{ year }}년</a>{% endfor %}</nav><nav aria-label="실행 기록 월">{% for month,url in period_ui.month_links %}<a href="{{ url }}"{% if period_selection.month == month %} aria-current="true"{% endif %}>{{ month }}월</a>{% endfor %}</nav></details>
