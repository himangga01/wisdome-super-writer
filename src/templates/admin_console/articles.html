{% extends "admin_console/base.html" %}
{% load static %}
{% block title %}기사 검토 · Wisdome{% endblock %}
{% block content %}
<div class="page-head">
  <div>
    <p class="eyebrow">EDITORIAL</p>
    <h1>근거 기반 기사 검토</h1>
    <p class="muted">주장 유형, 근거 관계, 제외 사유와 차단 검사를 확인합니다. 재검증을 모두 통과한 기사만 발행 화면으로 이동할 수 있습니다.</p>
  </div>
</div>
<section class="panel" aria-labelledby="article-list-title">
  <h2 id="article-list-title">기사 목록</h2>
  <div id="article-list" class="list" aria-live="polite"></div>
</section>
<section id="article-detail" class="panel hidden" aria-live="polite" aria-label="기사 상세"></section>
{% endblock %}
{% block scripts %}<script src="{% static 'admin_console/articles.js' %}"></script>{% endblock %}
