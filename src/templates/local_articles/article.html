{% extends 'portal/base.html' %}
{% block title %}{{ article_name }} · {{ run_name }}{% endblock %}
{% block portal_css %}<link rel="stylesheet" href="/static/portal/app.css">{% endblock %}
{% block extra_css %}<link rel="icon" href="/static/local_articles/generic-housing-hero.png" type="image/png">{% endblock %}
{% block content %}
<nav class="archive-breadcrumbs" aria-label="주택 콘텐츠 경로"><a href="{% url 'local-article-index' %}">모든 실행 결과</a><span aria-hidden="true">/</span><a href="{% url 'local-article-run' run_name=run_name %}">{{ run_name }}</a></nav>
<article class="archive-article">{{ article_html|safe }}</article>
{% endblock %}
